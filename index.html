<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bauchipedia – Interaktives Gefühlsraster</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 16px; background: #eef0f5; }
</style>
</head>
<body>
<meta charset="utf-8">
<style>
.bp-widget {
  --unangenehm: #6a3fa0;
  --angenehm: #21b39a;
  --ink: #16234a;
  --chip-bg: rgba(255,255,255,0.92);
  --chip-border: rgba(22,35,74,0.15);
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-family: var(--sans);
  color: var(--ink);
}
.bp-widget, .bp-widget * { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) {
  .bp-widget .chip, .bp-widget .chip:hover { transition: none !important; transform: translate(-50%, -50%) !important; }
}
.bp-widget button:focus-visible, .bp-widget input:focus-visible, .bp-widget .chip:focus-visible {
  outline: 2px solid #7fe0d0;
  outline-offset: 2px;
}
.bp-widget #app {
  position: relative;
  width: 100%;
  height: min(80vh, 760px);
  min-height: 460px;
  overflow: hidden;
  background: #0d1220;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}
.bp-widget #toolbar {
  position: absolute;
  top: 12px; left: 12px; right: 12px;
  z-index: 30;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex-wrap: wrap;
  pointer-events: none;
}
.bp-widget #toolbar > * { pointer-events: auto; }
.bp-widget #wordmark {
  background: rgba(13,18,32,0.85);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 8px 14px;
  color: #fff;
  backdrop-filter: blur(4px);
}
.bp-widget #wordmark .title {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.bp-widget #wordmark .sub {
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 2px;
}
.bp-widget #search-wrap {
  position: relative;
  background: rgba(13,18,32,0.85);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 8px 10px;
  backdrop-filter: blur(4px);
}
.bp-widget #search {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 14px;
  width: 220px;
}
.bp-widget #search::placeholder { color: rgba(255,255,255,0.5); }
.bp-widget #search-results {
  position: absolute;
  top: 100%; left: 0; right: 0;
  margin-top: 6px;
  background: #131a2e;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  overflow: hidden;
  display: none;
  max-height: 260px;
  overflow-y: auto;
}
.bp-widget #search-results button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  color: #fff;
  padding: 8px 10px;
  font-size: 14px;
  cursor: pointer;
}
.bp-widget #search-results button:hover { background: rgba(255,255,255,0.1); }
.bp-widget .toolbtn {
  background: rgba(13,18,32,0.85);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(4px);
}
.bp-widget .toolbtn:hover { background: rgba(255,255,255,0.12); }
.bp-widget #zoomctl {
  display: flex;
  gap: 4px;
  margin-left: auto;
}
.bp-widget #hint {
  position: absolute;
  bottom: 10px; left: 12px;
  z-index: 30;
  color: rgba(255,255,255,0.55);
  font-size: 12px;
  background: rgba(13,18,32,0.6);
  padding: 6px 10px;
  border-radius: 8px;
  pointer-events: none;
}
.bp-widget #viewport {
  position: absolute;
  inset: 0;
  overflow: hidden;
  cursor: grab;
}
.bp-widget #viewport.dragging { cursor: grabbing; }
.bp-widget #world {
  position: absolute;
  left: 0; top: 0;
  width: 2600px;
  height: 2000px;
  transform-origin: 0 0;
  background:
    radial-gradient(ellipse at 15% 15%, rgba(120,60,170,0.9), rgba(120,60,170,0) 60%),
    radial-gradient(ellipse at 85% 15%, rgba(30,180,160,0.9), rgba(30,180,160,0) 60%),
    radial-gradient(ellipse at 15% 85%, rgba(150,110,190,0.55), rgba(150,110,190,0) 60%),
    radial-gradient(ellipse at 85% 85%, rgba(90,190,175,0.55), rgba(90,190,175,0) 60%),
    linear-gradient(135deg, #4a2f7a 0%, #35407a 35%, #2b6f7e 65%, #1f9a86 100%);
}
.bp-widget .axis-label {
  position: absolute;
  color: rgba(255,255,255,0.92);
  font-weight: 700;
  letter-spacing: 0.1em;
  font-size: 26px;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  background: rgba(13,18,32,0.32);
  padding: 5px 14px;
  border-radius: 10px;
  backdrop-filter: blur(2px);
  white-space: nowrap;
}
.bp-widget #label-top, .bp-widget #label-bottom { transform: translate(-50%, -50%); }
.bp-widget #label-left { transform: translate(-50%, -50%) rotate(-90deg); }
.bp-widget #label-right { transform: translate(-50%, -50%) rotate(90deg); }
.bp-widget .axis-line {
  position: absolute;
  background: rgba(255,255,255,0.25);
  pointer-events: none;
}
.bp-widget .chip {
  position: absolute;
  transform: translate(-50%, -50%);
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  color: var(--ink);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  transition: opacity .2s ease, transform .15s ease, box-shadow .15s ease;
  user-select: none;
}
.bp-widget .chip:hover { transform: translate(-50%, -50%) scale(1.08); }
.bp-widget .chip.dim { opacity: 0.18; }
.bp-widget .chip.related {
  background: #ffe9a8;
  border-color: #d9a600;
  box-shadow: 0 0 0 2px #ffcf4d, 0 2px 8px rgba(0,0,0,0.3);
  opacity: 1;
}
.bp-widget .chip.active {
  background: #16234a;
  color: #fff;
  box-shadow: 0 0 0 3px #7fe0d0, 0 2px 10px rgba(0,0,0,0.4);
  opacity: 1;
  z-index: 5;
}
.bp-widget #overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  pointer-events: none;
}
.bp-widget #popup {
  background: #fff;
  color: var(--ink);
  width: min(380px, 92%);
  padding: 24px 24px 28px;
  box-shadow: -12px 0 40px rgba(0,0,0,0.35);
  position: absolute;
  top: 0; right: 0; bottom: 0;
  overflow-y: auto;
  pointer-events: auto;
  transform: translateX(100%);
  transition: transform .25s ease;
  border-radius: 0 18px 18px 0;
}
.bp-widget #overlay.show #popup { transform: translateX(0); }
.bp-widget #popup h2 { margin: 0 0 4px; font-size: 26px; font-family: var(--serif); font-weight: 600; letter-spacing: 0.01em; }
.bp-widget #popup .badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 999px;
  margin-bottom: 12px;
  color: #fff;
}
.bp-widget #popup .desc { line-height: 1.55; font-size: 15px; margin: 0 0 14px; }
.bp-widget #popup .example {
  font-style: italic;
  color: #445;
  background: #f4f5fb;
  border-left: 3px solid var(--angenehm);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 14px;
  margin: 0 0 16px;
}
.bp-widget #popup .related-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #888;
  margin-bottom: 8px;
}
.bp-widget #popup .related-list { display: flex; flex-wrap: wrap; gap: 6px; }
.bp-widget #popup .related-list button {
  border: 1px solid var(--chip-border);
  background: #f0f1f7;
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
  color: var(--ink);
}
.bp-widget #popup .related-list button:hover { background: #e2e4f2; }
.bp-widget #popup .related-list span.plain {
  border: 1px dashed #ccc;
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 13px;
  color: #999;
}
.bp-widget #popup .close {
  position: absolute;
  top: 14px; right: 14px;
  background: #f0f1f7;
  border: none;
  width: 30px; height: 30px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  color: #555;
}
.bp-widget #popup .close:hover { background: #e2e4f2; }
</style>

<div class="bp-widget">
  <div id="app">
    <div id="viewport">
      <div id="world">
        <div class="axis-label" id="label-top">Aktivierend</div>
        <div class="axis-label" id="label-bottom">Deaktivierend</div>
        <div class="axis-label" id="label-left">Unangenehm</div>
        <div class="axis-label" id="label-right">Angenehm</div>
        <div class="axis-line" style="left:50%; top:0; width:1px; height:100%;"></div>
        <div class="axis-line" style="top:50%; left:0; height:1px; width:100%;"></div>
      </div>
    </div>
    <div id="toolbar">
      <div id="wordmark">
        <div class="title">Bauchipedia</div>
        <div class="sub">Gefühlsraster</div>
      </div>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="Begriff suchen…" autocomplete="off">
        <div id="search-results"></div>
      </div>
      <div id="zoomctl">
        <button class="toolbtn" id="zoom-out">−</button>
        <button class="toolbtn" id="zoom-reset">Reset</button>
        <button class="toolbtn" id="zoom-in">+</button>
      </div>
    </div>
    <div id="hint">Ziehen zum Verschieben · Scrollen/Pinch zum Zoomen · Klick für Details</div>
    <div id="overlay">
      <div id="popup"></div>
    </div>
  </div>
</div>

<script>
(function(){
const TERMS = [{"id": "angenehm-hoch-0", "term": "Akzeptiert", "valence": "angenehm", "arousal": "hoch", "description": "„Akzeptiert“ beschreibt einen emotionalen Zustand, in dem jemand sich angenommen, respektiert und als Teil einer Gemeinschaft oder Situation wertgeschätzt fühlt. Es ist ein Gefühl von Zugehörigkeit und innerer Ruhe, das oft mit Vertrauen und Sicherheit einhergeht.", "example": "„Ich fühlte mich endlich akzeptiert, als meine Kollegen mich in ihre Gespräche einbezogen.“", "related": ["angenehm-hoch-62", "angenehm-niedrig-71"]}, {"id": "angenehm-hoch-1", "term": "Albern", "valence": "angenehm", "arousal": "hoch", "description": "„Albern“ beschreibt einen emotionalen Zustand, in dem jemand sich verspielt, unbeschwert und oft ein wenig kindisch oder lustig verhält. Es ist ein Gefühl von Leichtigkeit und Spaß, das sich in übermütigem Verhalten oder komischen Aktionen ausdrückt.", "example": "„Ich fühlte mich albern und begann, in der Küche zu tanzen, während ich das Abendessen zubereitete.“", "related": ["angenehm-hoch-53", "angenehm-hoch-5", "angenehm-hoch-31"]}, {"id": "angenehm-hoch-2", "term": "Amüsiert", "valence": "angenehm", "arousal": "hoch", "description": "„Amüsiert“ beschreibt einen emotionalen Zustand, in dem jemand etwas unterhaltsam oder witzig findet, was oft mit einem Schmunzeln, Lachen oder einer heiteren Stimmung einhergeht. Es ist ein leichtes, angenehmes Gefühl, das durch etwas Lustiges oder Kurioses ausgelöst wird.", "example": "„Ich war ehrlich gesagt ziemlich amüsiert, als mein Hund versuchte, seinen eigenen Schwanz zu fangen.“", "related": []}, {"id": "angenehm-hoch-3", "term": "Aufgeregt", "valence": "angenehm", "arousal": "hoch", "description": "„Aufgeregt“ beschreibt einen emotionalen Zustand, in dem jemand voller Vorfreude, Nervosität oder Begeisterung ist, oft in Erwartung eines besonderen Ereignisses. Es ist ein Gefühl von Spannung und Energie, das sowohl positiv als auch leicht unruhig sein kann.", "example": "„Ich war aufgeregt, als ich erfuhr, dass ich für das Finale ausgewählt wurde.“", "related": ["unangenehm-hoch-91", "unangenehm-hoch-122", "angenehm-hoch-24"]}, {"id": "angenehm-hoch-4", "term": "Aufmerksam", "valence": "angenehm", "arousal": "hoch", "description": "„Aufmerksam“ beschreibt einen emotionalen Zustand, in dem jemand konzentriert und mit voller Achtsamkeit auf eine Person, Situation oder Aufgabe eingeht. Es ist ein Gefühl von Präsenz und Interesse, das oft mit Empathie oder Sorgfalt verbunden ist.", "example": "„Ich hörte ihr aufmerksam zu, um sicherzustellen, dass ich jedes Detail ihrer Geschichte verstand.“", "related": ["angenehm-hoch-60", "angenehm-hoch-46"]}, {"id": "angenehm-hoch-5", "term": "Ausgelassen", "valence": "angenehm", "arousal": "hoch", "description": "„Ausgelassen“ beschreibt einen emotionalen Zustand, in dem jemand fröhlich, unbeschwert und in ausgelassener Stimmung ist. Es ist ein Gefühl von Freude und Leichtigkeit, das sich oft in lautem Lachen, Tanzen oder lebhaftem Verhalten äußert.", "example": "„Ich fühlte mich ausgelassen, als wir auf der Party alle zusammen tanzten und lachten.“", "related": ["angenehm-hoch-27", "angenehm-hoch-10", "angenehm-hoch-31", "angenehm-hoch-1"]}, {"id": "angenehm-hoch-6", "term": "Befriedigt", "valence": "angenehm", "arousal": "hoch", "description": "„Befriedigt“ beschreibt einen emotionalen Zustand, in dem jemand sich zufrieden und erfüllt fühlt, weil ein Bedürfnis, Wunsch oder Ziel erfolgreich erreicht wurde. Es ist ein Gefühl von innerer Ruhe und Ausgeglichenheit.", "example": "„Ich war befriedigt, als ich nach einem langen Arbeitstag endlich mein Projekt abschließen konnte.“", "related": ["angenehm-niedrig-68", "angenehm-niedrig-85", "angenehm-niedrig-69"]}, {"id": "angenehm-hoch-7", "term": "Begeistert", "valence": "angenehm", "arousal": "hoch", "description": "„Begeistert“ beschreibt einen emotionalen Zustand, in dem jemand von großer Freude, Enthusiasmus oder starkem Interesse an etwas erfüllt ist. Es ist ein mitreißendes Gefühl, das oft mit Engagement, Lebhaftigkeit und Energie verbunden ist.", "example": "„Ich war sofort begeistert, als ich die Idee für unser gemeinsames Projekt hörte.“", "related": ["angenehm-hoch-24", "angenehm-hoch-43", "angenehm-hoch-10", "angenehm-hoch-3", "angenehm-hoch-37"]}, {"id": "angenehm-hoch-8", "term": "Behaglich", "valence": "angenehm", "arousal": "hoch", "description": "„Behaglich“ beschreibt ein Gefühl von körperlichem und geistigem Wohlbefinden, oft verbunden mit einer gemütlichen, sicheren oder angenehmen Umgebung. Es ist ein sanft positives Gefühl, das Ruhe und Zufriedenheit ausstrahlt.", "example": "„Ich lag auf dem Sofa, eingehüllt in eine warme Decke, und fühlte mich rundum behaglich.“", "related": ["angenehm-niedrig-71", "angenehm-niedrig-84", "angenehm-niedrig-67", "angenehm-niedrig-85"]}, {"id": "angenehm-hoch-9", "term": "Berührt", "valence": "angenehm", "arousal": "hoch", "description": "„Berührt“ beschreibt einen emotionalen Zustand, in dem jemand von einer Geste, Worten oder einem Ereignis innerlich bewegt und emotional ergriffen ist. Es ist ein Gefühl von Rührung , das oft mit Wärme und Nachdenklichkeit einhergeht.", "example": "„Ich fühlte mich tief berührt, als sie sich für all die Unterstützung bedankte, die ich ihr gegeben hatte.“", "related": ["angenehm-hoch-11", "angenehm-hoch-42"]}, {"id": "angenehm-hoch-10", "term": "Beschwingt", "valence": "angenehm", "arousal": "hoch", "description": "„Beschwingt“ beschreibt einen emotionalen Zustand, in dem jemand heiter, energiegeladen und voller Leichtigkeit ist. Es ist ein Gefühl von Freude und innerer Lebhaftigkeit, das oft mit einem beschwingten Auftreten oder Optimismus einhergeht.", "example": "„Nach dem erfolgreichen Treffen verließ ich beschwingt das Büro und freute mich auf den restlichen Tag.“", "related": ["angenehm-hoch-27", "angenehm-hoch-31", "angenehm-hoch-7", "angenehm-hoch-40", "angenehm-hoch-53"]}, {"id": "angenehm-hoch-11", "term": "Bewegt", "valence": "angenehm", "arousal": "hoch", "description": "„Bewegt“ beschreibt einen emotionalen Zustand, in dem jemand von einer Situation, einem Erlebnis oder einer Geste tief berührt und emotional ergriffen ist. Es ist ein Gefühl von Rührung, das oft mit Dankbarkeit, Freude oder Mitgefühl einhergeht.", "example": "„Ich fühlte mich bewegt, als ich die liebevollen Worte in ihrer Rede hörte.“", "related": ["angenehm-hoch-9"]}, {"id": "angenehm-hoch-12", "term": "Boshaft", "valence": "angenehm", "arousal": "hoch", "description": "„Boshaft“ beschreibt einen emotionalen Zustand, in dem jemand bewusst verletzend oder schadenfroh handelt, oft aus Ärger, Groll oder dem Wunsch, jemandem etwas heimzuzahlen. Es ist ein Gefühl von Absichtlichkeit, das von Negativität und Rachegefühlen geprägt ist.", "example": "„Ich fühlte mich boshaft und konnte nicht widerstehen, eine sarkastische Bemerkung zu machen, um ihn zu provozieren.“", "related": ["unangenehm-hoch-135"]}, {"id": "angenehm-hoch-13", "term": "Ehrfürchtig", "valence": "angenehm", "arousal": "hoch", "description": "„Ehrfürchtig“ beschreibt einen emotionalen Zustand, in dem jemand tiefen Respekt, Bewunderung und Demut gegenüber etwas Größerem oder Bedeutendem empfindet. Es ist ein Gefühl von stiller Achtung, oft verbunden mit einem Moment des Staunens oder der Besinnung.", "example": "„Ich fühlte mich ehrfürchtig, als ich die majestätische Kathedrale betrat und die hohe Decke über mir betrachtete.“", "related": ["angenehm-hoch-55"]}, {"id": "angenehm-hoch-14", "term": "Eifrig", "valence": "angenehm", "arousal": "hoch", "description": "„Eifrig“ beschreibt einen emotionalen Zustand, in dem jemand voller Begeisterung und Ungeduld darauf wartet, etwas zu tun oder zu erleben. Es ist ein Gefühl von Vorfreude und Motivation, das oft mit Tatendrang und Energie einhergeht.", "example": "„Ich war eifrig, das neue Buch zu lesen, das ich gerade gekauft hatte.“", "related": ["angenehm-hoch-17", "angenehm-hoch-43", "angenehm-hoch-7"]}, {"id": "angenehm-hoch-15", "term": "Ekstatisch", "valence": "angenehm", "arousal": "hoch", "description": "„Ekstatisch“ beschreibt einen emotionalen Zustand intensiver Freude und Begeisterung, in dem jemand überwältigt von Glück und Euphorie ist. Es ist ein Gefühl, das oft mit spontanen und leidenschaftlichen Reaktionen einhergeht.", "example": "„Ich war ekstatisch, als ich erfuhr, dass ich den Wettbewerb gewonnen hatte.“", "related": ["angenehm-hoch-24", "angenehm-niedrig-76", "angenehm-hoch-34"]}, {"id": "angenehm-hoch-16", "term": "Energiegeladen", "valence": "angenehm", "arousal": "hoch", "description": "„Energiegeladen“ beschreibt einen emotionalen Zustand, in dem jemand sich voller Kraft, Vitalität und Motivation fühlt. Es ist ein Gefühl von innerer Antriebskraft, das oft mit Tatendrang und Optimismus einhergeht.", "example": "„Nach einer erholsamen Nacht fühlte ich mich energiegeladen und bereit, den Tag anzupacken.“", "related": ["angenehm-hoch-40", "angenehm-hoch-43"]}, {"id": "angenehm-hoch-17", "term": "Engagiert", "valence": "angenehm", "arousal": "hoch", "description": "„Engagiert“ beschreibt einen emotionalen Zustand, in dem jemand sich voll und ganz auf eine Tätigkeit, Aufgabe oder Situation konzentriert und mit Begeisterung daran teilnimmt. Es ist ein Gefühl von tiefer Beteiligung und Motivation, das oft mit einem starken Fokus und Interesse einhergeht.", "example": "„Ich fühlte mich voll engagiert, während ich an unserem gemeinsamen Projekt arbeitete.“", "related": ["angenehm-hoch-43"]}, {"id": "angenehm-hoch-18", "term": "Entschlossen", "valence": "angenehm", "arousal": "hoch", "description": "„Entschlossen“ beschreibt einen emotionalen Zustand, in dem jemand fest entschlossen ist, eine Entscheidung umzusetzen oder ein Ziel zu erreichen. Es ist ein Gefühl von innerer Klarheit, Zielstrebigkeit und Willenskraft, das oft mit Selbstbewusstsein und Entschiedenheit einhergeht.", "example": "„Ich war entschlossen, das Projekt erfolgreich abzuschließen, egal welche Herausforderungen noch auf mich zukamen.“", "related": ["angenehm-hoch-43"]}, {"id": "angenehm-hoch-19", "term": "Entzückt", "valence": "angenehm", "arousal": "hoch", "description": "„Entzückt“ beschreibt einen emotionalen Zustand intensiver Freude und Begeisterung, oft ausgelöst durch etwas besonders Schönes, Berührendes oder Wunderbares. Es ist ein Gefühl, das mit Staunen, Begeisterung und strahlender Freude einhergeht.", "example": "„Ich war völlig entzückt, als ich das leuchtende Feuerwerk über der Stadt sah.“", "related": ["angenehm-hoch-7", "angenehm-hoch-21", "angenehm-hoch-29"]}, {"id": "angenehm-hoch-20", "term": "Erfolgreich", "valence": "angenehm", "arousal": "hoch", "description": "„Erfolgreich“ beschreibt einen emotionalen Zustand, in dem jemand sich zufrieden und erfüllt fühlt, weil ein Ziel erreicht oder eine Aufgabe gut bewältigt wurde. Es ist ein Gefühl von Stolz und Zufriedenheit, das oft mit Selbstbewusstsein einhergeht.", "example": "„Ich fühlte mich erfolgreich, nachdem ich das schwierige Projekt rechtzeitig abgeschlossen hatte.“", "related": ["angenehm-hoch-39", "angenehm-hoch-51", "angenehm-niedrig-68"]}, {"id": "angenehm-hoch-21", "term": "Erfreut", "valence": "angenehm", "arousal": "hoch", "description": "„Erfreut“ beschreibt einen emotionalen Zustand, in dem jemand sich über etwas Positives oder Schönes freut. Es ist ein Gefühl von Zufriedenheit oder Glück, das durch eine angenehme Erfahrung oder gute Nachrichten ausgelöst wird.", "example": "„Ich war wirklich erfreut, als ich hörte, dass mein Freund die Prüfung bestanden hat.“", "related": []}, {"id": "angenehm-hoch-22", "term": "Erfrischt", "valence": "angenehm", "arousal": "hoch", "description": "„Erfrischt“ beschreibt einen emotionalen Zustand, in dem jemand sich nach einer Pause, Erholung oder einem positiven Erlebnis körperlich und geistig erneuert und voller Energie fühlt. Es ist ein Gefühl von Frische und neuer Lebenskraft.", "example": "„Nach einer kühlen Dusche und einer Tasse Kaffee fühlte ich mich erfrischt und bereit für den Tag.“", "related": []}, {"id": "angenehm-hoch-23", "term": "Erstaunt", "valence": "angenehm", "arousal": "hoch", "description": "„Erstaunt“ beschreibt einen emotionalen Zustand, in dem jemand von etwas Unerwartetem oder Bemerkenswertem überrascht und beeindruckt ist. Es ist ein intensives Gefühl der Überraschung, das oft mit Bewunderung oder Verwunderung einhergeht.", "example": "„Ich war erstaunt, wie schnell er das komplexe Problem gelöst hat.“", "related": ["angenehm-hoch-59", "angenehm-hoch-25", "unangenehm-hoch-123"]}, {"id": "angenehm-hoch-24", "term": "Euphorisch", "valence": "angenehm", "arousal": "hoch", "description": "„Euphorisch“ beschreibt einen emotionalen Zustand intensiver Freude und Begeisterung, in dem jemand sich übermäßig glücklich und voller positiver Energie fühlt. Es ist ein Gefühl von Hochstimmung und grenzenlosem Optimismus, das oft mit Aufregung und Lebhaftigkeit einhergeht.", "example": "„Ich war euphorisch, als ich die Nachricht erhielt, dass mein Buch veröffentlicht wird.“", "related": ["angenehm-hoch-7", "angenehm-hoch-29", "angenehm-hoch-10"]}, {"id": "angenehm-hoch-25", "term": "Fasziniert", "valence": "angenehm", "arousal": "hoch", "description": "„Fasziniert“ beschreibt einen emotionalen Zustand, in dem jemand starkes Interesse und Bewunderung für etwas empfindet, das außergewöhnlich, spannend oder beeindruckend ist. Es ist ein Gefühl von Staunen und tiefer Aufmerksamkeit, das oft mit dem Wunsch einhergeht, mehr darüber zu erfahren.", "example": "„Ich war fasziniert von der Detailgenauigkeit der Gemälde im Museum.“", "related": ["angenehm-hoch-44", "angenehm-hoch-7", "angenehm-hoch-37", "angenehm-hoch-34", "angenehm-hoch-59"]}, {"id": "angenehm-hoch-26", "term": "Feierlich", "valence": "angenehm", "arousal": "hoch", "description": "„Feierlich“ beschreibt einen emotionalen Zustand, in dem jemand sich ernst, würdevoll und von der Bedeutung einer Situation tief bewegt fühlt. Es ist ein Gefühl von Respekt und Nachdenklichkeit, das oft in besonderen Momenten wie Zeremonien oder wichtigen Entscheidungen empfunden wird.", "example": "„Ich fühlte mich feierlich, als wir gemeinsam die Kerzen anzündeten und an die vergangene Zeit dachten.“", "related": ["angenehm-hoch-9"]}, {"id": "angenehm-hoch-27", "term": "Fröhlich", "valence": "angenehm", "arousal": "hoch", "description": "„Fröhlich“ beschreibt einen emotionalen Zustand, in dem jemand heiter, gut gelaunt und voller positiver Energie ist. Es ist ein Gefühl von Leichtigkeit und Zufriedenheit, das oft mit einem Lächeln oder einer optimistischen Ausstrahlung einhergeht.", "example": "„Ich war den ganzen Morgen fröhlich, weil die Sonne schien und ich gute Neuigkeiten erhalten hatte.“", "related": ["angenehm-hoch-31", "angenehm-hoch-10", "angenehm-hoch-53"]}, {"id": "angenehm-hoch-28", "term": "Gehört", "valence": "angenehm", "arousal": "hoch", "description": "„Gehört“ beschreibt einen emotionalen Zustand, in dem jemand das Gefühl hat, mit seinen Gedanken, Gefühlen oder Anliegen von anderen wahrgenommen und verstanden zu werden. Es ist ein Gefühl von Anerkennung und Wertschätzung, das oft mit innerer Erleichterung und Zufriedenheit einhergeht.", "example": "„Ich fühlte mich gehört, als mein Team meine Vorschläge ernst nahm und darüber diskutierte.“", "related": ["angenehm-hoch-58", "angenehm-hoch-62"]}, {"id": "angenehm-hoch-29", "term": "Glücklich", "valence": "angenehm", "arousal": "hoch", "description": "„Glücklich“ beschreibt einen emotionalen Zustand von tiefem Wohlbefinden, Freude und innerer Zufriedenheit. Es ist ein positives Gefühl, das oft durch erfüllte Wünsche, schöne Erlebnisse oder liebevolle Beziehungen ausgelöst wird.", "example": "„Ich fühlte mich unglaublich glücklich, als ich meine Freunde nach so langer Zeit wiedersehen konnte.“", "related": ["angenehm-niedrig-85", "angenehm-niedrig-68", "angenehm-hoch-10"]}, {"id": "angenehm-hoch-30", "term": "Gut", "valence": "angenehm", "arousal": "hoch", "description": "„Gut“ beschreibt einen emotionalen Zustand, in dem jemand sich wohl, zufrieden und innerlich im Einklang fühlt. Es ist ein allgemeines Gefühl von positiver Stimmung und Ausgeglichenheit, das oft mit Leichtigkeit und Zufriedenheit einhergeht.", "example": "„Nach einem langen Spaziergang an der frischen Luft fühlte ich mich richtig gut.“", "related": ["angenehm-niedrig-85", "angenehm-niedrig-64", "angenehm-niedrig-84", "angenehm-hoch-29", "angenehm-hoch-8"]}, {"id": "angenehm-hoch-31", "term": "Heiter", "valence": "angenehm", "arousal": "hoch", "description": "„Heiter“ beschreibt einen emotionalen Zustand, in dem jemand gelassen, beschwingt und in guter, unbeschwerter Stimmung ist. Es ist ein Gefühl von innerer Leichtigkeit und positiver Ausstrahlung, das oft mit Lächeln oder Optimismus einhergeht.", "example": "„Nach dem langen Spaziergang in der Sonne fühlte ich mich angenehm heiter und voller Energie.“", "related": ["angenehm-hoch-27", "angenehm-niedrig-73", "angenehm-hoch-10"]}, {"id": "angenehm-hoch-32", "term": "Herausgefordert", "valence": "angenehm", "arousal": "hoch", "description": "„Herausgefordert“ beschreibt einen emotionalen Zustand, in dem jemand sich vor eine anspruchsvolle Aufgabe oder Situation gestellt sieht, die Einsatz und Fähigkeiten verlangt. Es ist ein Gefühl von Anspannung und Motivation, das oft mit dem Wunsch verbunden ist, die Herausforderung zu meistern.", "example": "„Ich fühlte mich herausgefordert, als ich merkte, wie viel Wissen ich für das neue Projekt brauchen würde.“", "related": ["angenehm-hoch-43", "unangenehm-hoch-91"]}, {"id": "angenehm-hoch-33", "term": "Hingebungsvoll", "valence": "angenehm", "arousal": "hoch", "description": "„Hingebungsvoll“ beschreibt einen emotionalen Zustand, in dem jemand sich mit voller Aufmerksamkeit, Liebe und Leidenschaft einer Sache, Person oder Aufgabe widmet. Es ist ein Gefühl der völligen Aufopferung und Fokussierung, das oft mit großer Sorgfalt und Einsatz einhergeht.", "example": "„Ich habe ihr hingebungsvoll zugehört, weil ich spürte, wie wichtig ihr dieses Thema war.“", "related": ["angenehm-niedrig-78", "angenehm-hoch-7", "angenehm-hoch-41"]}, {"id": "angenehm-hoch-34", "term": "Hingerissen", "valence": "angenehm", "arousal": "hoch", "description": "„Hingerissen“ beschreibt einen emotionalen Zustand, in dem jemand von etwas Schönem, Faszinierendem oder Berührendem vollkommen begeistert und tief bewegt ist. Es ist ein Gefühl von intensiver Freude und Staunen, das oft mit völliger Hingabe einhergeht.", "example": "„Ich war hingerissen, als ich das Orchester live spielen hörte und die Musik mich völlig erfüllte.“", "related": ["angenehm-hoch-57", "angenehm-hoch-7", "angenehm-hoch-25"]}, {"id": "angenehm-hoch-35", "term": "Hingezogen", "valence": "angenehm", "arousal": "hoch", "description": "„Hingezogen“ beschreibt einen emotionalen Zustand, in dem jemand ein starkes Gefühl der Anziehung oder Verbundenheit zu einer Person, einer Idee oder einer Sache verspürt. Es ist ein intensives, oft inneres Drängen, das mit Faszination, Interesse oder Zuneigung einhergeht.", "example": "„Ich fühlte mich von Anfang an zu ihr hingezogen, weil sie so herzlich und offen war.“", "related": ["angenehm-hoch-25", "angenehm-hoch-57", "unangenehm-niedrig-171"]}, {"id": "angenehm-hoch-36", "term": "Hoffnungsvoll", "valence": "angenehm", "arousal": "hoch", "description": "„Hoffnungsvoll“ beschreibt einen emotionalen Zustand, in dem jemand optimistisch und zuversichtlich ist, dass sich eine Situation positiv entwickeln wird. Es ist ein Gefühl von Erwartung und innerer Stärke, das oft mit Glauben an bessere Zeiten verbunden ist.", "example": "„Ich war hoffnungsvoll, dass das Bewerbungsgespräch gut gelaufen war und ich die Stelle bekommen würde.“", "related": ["angenehm-hoch-45"]}, {"id": "angenehm-hoch-37", "term": "Inspiriert", "valence": "angenehm", "arousal": "hoch", "description": "„Inspiriert“ beschreibt einen emotionalen Zustand, in dem jemand sich von einer Idee, Person oder Situation motiviert und beflügelt fühlt. Es ist ein Gefühl von kreativer Anregung und Begeisterung, das oft mit dem Drang einhergeht, etwas Neues zu schaffen oder umzusetzen.", "example": "„Nach dem Vortrag fühlte ich mich inspiriert, an meinen eigenen Projekten weiterzuarbeiten.“", "related": ["angenehm-hoch-43", "angenehm-hoch-7", "angenehm-hoch-3", "angenehm-niedrig-68"]}, {"id": "angenehm-hoch-38", "term": "Klar", "valence": "angenehm", "arousal": "hoch", "description": "„Klar“ beschreibt einen emotionalen Zustand, in dem jemand sich fokussiert, gedanklich geordnet und frei von Verwirrung oder Zweifel fühlt. Es ist ein Gefühl von innerer Übersicht und Sicherheit, das oft mit Entschlossenheit und Ruhe einhergeht.", "example": "„Nach dem Gespräch mit meinem Mentor fühlte ich mich klar und wusste genau, welchen nächsten Schritt ich gehen sollte.“", "related": ["angenehm-hoch-46", "angenehm-hoch-50"]}, {"id": "angenehm-hoch-39", "term": "Kompetent", "valence": "angenehm", "arousal": "hoch", "description": "„Kompetent“ beschreibt einen emotionalen Zustand, in dem jemand sich fähig, selbstbewusst und sicher fühlt, eine Aufgabe oder Herausforderung erfolgreich zu bewältigen. Es ist ein Gefühl von Können und Effektivität, das oft mit Stolz und innerer Zufriedenheit einhergeht.", "example": "„Ich fühlte mich kompetent, als ich das Problem schnell lösen und meinem Team helfen konnte.“", "related": []}, {"id": "angenehm-hoch-40", "term": "Lebendig", "valence": "angenehm", "arousal": "hoch", "description": "„Lebendig“ beschreibt einen emotionalen Zustand, in dem jemand sich voller Energie, Lebensfreude und innerer Vitalität fühlt. Es ist ein Gefühl intensiver Präsenz und Begeisterung, das oft mit Tatendrang und positiven Emotionen einhergeht.", "example": "„Ich fühlte mich lebendig, als ich den Wind im Gesicht spürte und die Sonne über dem Horizont aufging.“", "related": ["angenehm-hoch-16", "angenehm-hoch-10", "angenehm-hoch-27"]}, {"id": "angenehm-hoch-41", "term": "Leidenschaftlich", "valence": "angenehm", "arousal": "hoch", "description": "„Leidenschaftlich“ beschreibt einen emotionalen Zustand, in dem jemand von intensiver Begeisterung, starken Gefühlen oder tiefer Überzeugung erfüllt ist. Es ist ein Gefühl von innerer Glut und Hingabe, das oft mit engagiertem und energischem Ausdruck einhergeht.", "example": "„Er sprach so leidenschaftlich über seine Vision, dass alle im Raum mitgerissen wurden.“", "related": ["angenehm-hoch-7", "angenehm-hoch-57", "angenehm-hoch-16"]}, {"id": "angenehm-hoch-42", "term": "Mitfühlend", "valence": "angenehm", "arousal": "hoch", "description": "„Mitfühlend“ beschreibt einen emotionalen Zustand, in dem jemand tiefes Verständnis, Empathie und Fürsorge für die Gefühle oder das Leid anderer empfindet. Es ist ein Gefühl von innerer Wärme und dem Wunsch, zu helfen oder Trost zu spenden.", "example": "„Ich fühlte mich mitfühlend, als meine Freundin von ihren Schwierigkeiten erzählte, und wollte sie unbedingt unterstützen.“", "related": []}, {"id": "angenehm-hoch-43", "term": "Motiviert", "valence": "angenehm", "arousal": "hoch", "description": "„Motiviert“ beschreibt einen emotionalen Zustand, in dem jemand voller Antrieb und Entschlossenheit ist, ein Ziel zu erreichen oder eine Aufgabe anzugehen. Es ist ein Gefühl von innerer Energie und Fokus, das oft mit Begeisterung und Tatendrang einhergeht.", "example": "„Ich war motiviert, meine Trainingsziele zu erreichen, nachdem ich erste Fortschritte gesehen hatte.“", "related": ["angenehm-hoch-17", "angenehm-hoch-7", "angenehm-hoch-37"]}, {"id": "angenehm-hoch-44", "term": "Neugierig", "valence": "angenehm", "arousal": "hoch", "description": "„Neugierig“ beschreibt einen emotionalen Zustand, in dem jemand starkes Interesse und Wissensdurst empfindet, um mehr über etwas Unbekanntes oder Faszinierendes zu erfahren. Es ist ein Gefühl von Offenheit und Entdeckerfreude, das oft mit Fragen und aufmerksamer Beobachtung einhergeht.", "example": "„Ich war neugierig, als ich das geheimnisvolle Buch auf dem Tisch liegen sah und wissen wollte, worum es darin ging.“", "related": ["angenehm-hoch-25"]}, {"id": "angenehm-hoch-45", "term": "Optimistisch", "valence": "angenehm", "arousal": "hoch", "description": "„Optimistisch“ beschreibt einen emotionalen Zustand, in dem jemand heiter, positiv gestimmt und voller Zuversicht ist. Es ist ein Gefühl von Lebensfreude und Energie, das oft mit einer ansteckenden guten Laune einhergeht.", "example": "„Nach den ersten Erfolgen war ich richtig optimistisch und freute mich auf die nächsten Herausforderungen.“", "related": ["angenehm-hoch-36"]}, {"id": "angenehm-hoch-46", "term": "Präsent", "valence": "angenehm", "arousal": "hoch", "description": "„Präsent“ beschreibt einen emotionalen Zustand, in dem jemand vollständig im Moment und aufmerksam bei der aktuellen Situation ist. Es ist ein Gefühl von Achtsamkeit und Klarheit, bei dem weder Vergangenheit noch Zukunft die Wahrnehmung stören.", "example": "„Ich fühlte mich präsent, als ich mit geschlossenen Augen den Geräuschen des Waldes lauschte.“", "related": ["angenehm-hoch-60", "angenehm-niedrig-72", "angenehm-hoch-38"]}, {"id": "angenehm-hoch-47", "term": "Sehnsüchtig (Wunsch)", "valence": "angenehm", "arousal": "hoch", "description": "„Sehnsüchtig“ beschreibt einen emotionalen Zustand, in dem jemand einen starken Wunsch oder eine Hoffnung auf etwas hat, das noch unerreichbar scheint. Es ist ein Gefühl, das oft mit Träumen, Erwartungen und leichtem Wehmut verbunden ist.", "example": "„Ich blickte sehnsüchtig auf die Bilder von fernen Ländern und wünschte mir, dort zu sein.“", "related": ["angenehm-hoch-36"]}, {"id": "angenehm-hoch-48", "term": "Selbstbewusst", "valence": "angenehm", "arousal": "hoch", "description": "„Selbstbewusst“ beschreibt einen emotionalen Zustand, in dem jemand Vertrauen in die eigenen Fähigkeiten, Entscheidungen oder sein Auftreten hat. Es ist ein Gefühl von innerer Sicherheit und Stärke, das oft mit einem klaren und überzeugenden Verhalten einhergeht.", "example": "„Ich war selbstbewusst, als ich meine Präsentation hielt und die Fragen souverän beantwortete.“", "related": ["angenehm-niedrig-81", "angenehm-hoch-39", "angenehm-hoch-51"]}, {"id": "angenehm-hoch-49", "term": "Sprachlos", "valence": "angenehm", "arousal": "hoch", "description": "„Sprachlos“ beschreibt einen emotionalen Zustand, in dem jemand so überrascht, beeindruckt oder überwältigt ist, dass die Worte fehlen. Es ist ein Gefühl, das oft mit Staunen, Schock oder intensiver Rührung einhergeht.", "example": "„Ich war völlig sprachlos, als ich die atemberaubende Aussicht vom Gipfel aus sah.“", "related": ["unangenehm-hoch-111", "unangenehm-hoch-123", "unangenehm-hoch-100"]}, {"id": "angenehm-hoch-50", "term": "Stabil", "valence": "angenehm", "arousal": "hoch", "description": "„Stabil“ beschreibt einen emotionalen Zustand, in dem jemand sich innerlich gefestigt, ausgeglichen und widerstandsfähig fühlt. Es ist ein Gefühl von Sicherheit und Beständigkeit, das oft mit Ruhe und Selbstkontrolle einhergeht.", "example": "„Nach der intensiven Therapie fühlte ich mich endlich wieder stabil und bereit, nach vorne zu schauen.“", "related": ["angenehm-niedrig-64", "angenehm-niedrig-72", "angenehm-niedrig-81"]}, {"id": "angenehm-hoch-51", "term": "Stolz", "valence": "angenehm", "arousal": "hoch", "description": "„Stolz“ beschreibt einen emotionalen Zustand, in dem jemand Freude und Zufriedenheit über eigene Leistungen, Errungenschaften oder die von anderen empfindet. Es ist ein Gefühl von Wertschätzung und Anerkennung, das oft mit einem gesteigerten Selbstbewusstsein einhergeht.", "example": "„Ich war stolz, als ich mein lang ersehntes Ziel endlich erreicht hatte.“", "related": ["angenehm-hoch-62", "angenehm-niedrig-68", "angenehm-hoch-52"]}, {"id": "angenehm-hoch-52", "term": "Überlegen", "valence": "angenehm", "arousal": "hoch", "description": "„Überlegen“ beschreibt einen emotionalen Zustand, in dem jemand sich anderen gegenüber im Vorteil fühlt, sei es durch Wissen, Fähigkeiten, Status oder Selbstbewusstsein. Es ist ein Gefühl von Überlegenheit, das oft mit Selbstsicherheit und manchmal mit Arroganz einhergeht.", "example": "„Ich fühlte mich überlegen, weil ich die Aufgabe schneller und besser lösen konnte als die anderen.“", "related": ["angenehm-hoch-48"]}, {"id": "angenehm-hoch-53", "term": "Unbeschwer", "valence": "angenehm", "arousal": "hoch", "description": "„Unbeschwert“ beschreibt einen emotionalen Zustand, in dem jemand sich frei von Sorgen, Verpflichtungen oder Belastungen fühlt. Es ist ein Gefühl von Leichtigkeit und Freude, das oft mit Sorglosigkeit und Gelassenheit einhergeht.", "example": "„Ich fühlte mich unbeschwert, als ich durch die Blumenwiese lief und die Sonne auf meiner Haut spürte.“", "related": ["angenehm-niedrig-73", "angenehm-hoch-31"]}, {"id": "angenehm-hoch-54", "term": "Unterstützt", "valence": "angenehm", "arousal": "hoch", "description": "„Unterstützt“ beschreibt einen emotionalen Zustand, in dem jemand sich von anderen getragen, ermutigt und nicht allein gelassen fühlt. Es ist ein Gefühl von Sicherheit und Geborgenheit, das oft mit Dankbarkeit und Vertrauen einhergeht.", "example": "„Ich fühlte mich unterstützt, als meine Freunde mir ihre Hilfe in einer schwierigen Phase anboten.“", "related": ["angenehm-hoch-28", "angenehm-hoch-62", "angenehm-niedrig-71"]}, {"id": "angenehm-hoch-55", "term": "Verehrend", "valence": "angenehm", "arousal": "hoch", "description": "„Verehrend“ beschreibt einen emotionalen Zustand, in dem jemand starke Zuneigung, Bewunderung und Liebe für eine Person oder Sache empfindet. Es ist ein Gefühl der tiefen Wertschätzung, das oft mit Respekt und Hingabe einhergeht.", "example": "„Ich sah sie mit verehrendem Blick an, während sie voller Leidenschaft von ihren Träumen erzählte.“", "related": ["angenehm-hoch-13"]}, {"id": "angenehm-hoch-56", "term": "Verknallt", "valence": "angenehm", "arousal": "hoch", "description": "„Verknallt“ beschreibt einen emotionalen Zustand, in dem jemand von einer intensiven, oft schwärmerischen Zuneigung oder romantischen Faszination für eine Person erfüllt ist. Es ist ein Gefühl von Aufregung und Schwärmerei, das oft impulsiv und überwältigend wirkt.", "example": "„Ich war völlig verknallt und konnte an nichts anderes denken, als an ihr Lächeln.“", "related": ["angenehm-hoch-57", "angenehm-hoch-34", "angenehm-hoch-7"]}, {"id": "angenehm-hoch-57", "term": "Verliebt", "valence": "angenehm", "arousal": "hoch", "description": "„Verliebt“ beschreibt einen emotionalen Zustand, in dem jemand tiefe Zuneigung, Bewunderung und ein starkes romantisches Interesse für eine andere Person empfindet. Es ist ein intensives, oft euphorisches Gefühl, das von Gedanken an die Person und dem Wunsch nach Nähe geprägt ist.", "example": "„Seit unserem Treffen bin ich völlig verliebt und kann an nichts anderes mehr denken.“", "related": ["angenehm-hoch-34", "angenehm-hoch-63", "angenehm-niedrig-77", "angenehm-hoch-55"]}, {"id": "angenehm-hoch-58", "term": "Verstanden", "valence": "angenehm", "arousal": "hoch", "description": "„Verstanden“ beschreibt einen emotionalen Zustand, in dem jemand das Gefühl hat, dass seine Gedanken, Gefühle oder Bedürfnisse von anderen richtig wahrgenommen und nachvollzogen werden. Es ist ein Gefühl von Anerkennung und Akzeptanz, das oft mit Erleichterung und Geborgenheit einhergeht.", "example": "„Ich fühlte mich verstanden, als mein Freund genau das ausdrückte, was ich selbst nicht in Worte fassen konnte.“", "related": ["angenehm-hoch-0", "angenehm-hoch-28"]}, {"id": "angenehm-hoch-59", "term": "Verwundert", "valence": "angenehm", "arousal": "hoch", "description": "„Verwundert“ beschreibt einen emotionalen Zustand, in dem jemand überrascht und erstaunt ist, oft über etwas Unerwartetes oder Ungewöhnliches. Es ist ein Gefühl des Staunens, das mit Nachdenken oder Irritation einhergehen kann.", "example": "„Ich war verwundert, als ich sah, dass mitten im Winter Blumen auf der Wiese blühten.\"", "related": ["angenehm-hoch-23", "unangenehm-hoch-123", "unangenehm-hoch-111", "unangenehm-hoch-119"]}, {"id": "angenehm-hoch-60", "term": "Wachsam", "valence": "angenehm", "arousal": "hoch", "description": "„Wachsam“ beschreibt einen emotionalen Zustand, in dem jemand aufmerksam und bereit ist, schnell auf mögliche Veränderungen oder Gefahren zu reagieren. Es ist ein Gefühl von Achtsamkeit und Konzentration, oft begleitet von erhöhter geistiger und körperlicher Bereitschaft.", "example": "„Ich war wachsam, als ich in der Dunkelheit Schritte hinter mir hörte.“", "related": ["angenehm-hoch-4"]}, {"id": "angenehm-hoch-61", "term": "Wagemutig", "valence": "angenehm", "arousal": "hoch", "description": "„Wagemutig“ beschreibt einen Zustand, in dem man bereit ist, Risiken einzugehen, um Neues zu erleben oder Herausforderungen zu meistern. Es ist ein positiver, energiegeladener Zustand, der von Abenteuerlust und Selbstvertrauen geprägt ist.", "example": "„Ich fühlte mich wagemutig, als ich zum ersten Mal aus dem Flugzeug sprang, um meinen Fallschirmsprung zu machen.“", "related": []}, {"id": "angenehm-hoch-62", "term": "Wertgeschätzt", "valence": "angenehm", "arousal": "hoch", "description": "„Wertgeschätzt“ beschreibt einen emotionalen Zustand, in dem jemand sich anerkannt, respektiert und dankbar behandelt fühlt. Es ist ein Gefühl von Bedeutung und Dankbarkeit, das oft mit Zufriedenheit und innerer Wärme einhergeht.", "example": "„Ich fühlte mich wertgeschätzt, als mein Team sich für meine Unterstützung bedankte.“", "related": ["angenehm-niedrig-74", "angenehm-niedrig-71"]}, {"id": "angenehm-hoch-63", "term": "Zärtlich", "valence": "angenehm", "arousal": "hoch", "description": "„Zärtlich“ beschreibt einen emotionalen Zustand, in dem jemand liebevoll, sanft und fürsorglich empfindet oder handelt. Es ist ein Gefühl von tiefer Zuneigung, das oft durch behutsame Berührungen, Worte oder Gesten zum Ausdruck gebracht wird.", "example": "„Ich fühlte mich zärtlich, als ich ihm vorsichtig die Hand hielt, um ihn zu trösten.“", "related": ["angenehm-niedrig-78", "angenehm-hoch-33"]}, {"id": "angenehm-niedrig-64", "term": "Ausgeglichen", "valence": "angenehm", "arousal": "niedrig", "description": "„Ausgeglichen“ beschreibt einen emotionalen Zustand, in dem jemand sich innerlich ruhig, stabil und harmonisch fühlt. Es ist ein Gefühl von Balance zwischen Gedanken, Gefühlen und äußeren Einflüssen, das oft mit Zufriedenheit und Gelassenheit einhergeht.", "example": "„Nach einer langen Yoga-Session fühlte ich mich ausgeglichen und voller innerer Ruhe.“", "related": ["angenehm-niedrig-73", "angenehm-niedrig-85", "angenehm-niedrig-72", "angenehm-hoch-50", "angenehm-niedrig-80"]}, {"id": "angenehm-niedrig-65", "term": "Behaglich", "valence": "angenehm", "arousal": "niedrig", "description": "„Behaglich“ beschreibt ein Gefühl von körperlichem und geistigem Wohlbefinden, oft verbunden mit einer gemütlichen, sicheren oder angenehmen Umgebung. Es ist ein sanft positives Gefühl, das Ruhe und Zufriedenheit ausstrahlt.", "example": "„Ich lag auf dem Sofa, eingehüllt in eine warme Decke, und fühlte mich rundum behaglich.“", "related": ["angenehm-niedrig-71", "angenehm-niedrig-84", "angenehm-niedrig-67", "angenehm-niedrig-85"]}, {"id": "angenehm-niedrig-66", "term": "Dankbar", "valence": "angenehm", "arousal": "niedrig", "description": "„Dankbar“ beschreibt einen emotionalen Zustand, in dem jemand Wertschätzung und Freude über etwas empfundenes Gutes zeigt, sei es durch eine Handlung, Unterstützung oder eine positive Erfahrung. Es ist ein Gefühl von tiefer Anerkennung und Zufriedenheit.", "example": "„Ich fühlte mich dankbar, als meine Freunde mir in einer schwierigen Zeit zur Seite standen.“", "related": ["angenehm-niedrig-85", "angenehm-niedrig-68", "angenehm-hoch-9", "unangenehm-niedrig-158"]}, {"id": "angenehm-niedrig-67", "term": "Entspannt", "valence": "angenehm", "arousal": "niedrig", "description": "„Entspannt“ beschreibt einen emotionalen Zustand, in dem jemand sich ruhig, wohl und frei von Stress oder Sorgen fühlt. Es ist ein Gefühl von innerer Ausgeglichenheit und Komfort, das oft mit Gelassenheit einhergeht.", "example": "„Ich fühlte mich sofort entspannt, als ich die freundliche Atmosphäre im Raum spürte.“", "related": ["angenehm-niedrig-80", "angenehm-niedrig-73", "angenehm-hoch-8", "angenehm-niedrig-85"]}, {"id": "angenehm-niedrig-68", "term": "Erfüllt", "valence": "angenehm", "arousal": "niedrig", "description": "„Erfüllt“ beschreibt einen emotionalen Zustand, in dem jemand sich zufrieden, glücklich und innerlich vollständig fühlt, weil persönliche Wünsche, Ziele oder Werte verwirklicht wurden. Es ist ein Gefühl von tiefer Zufriedenheit und Sinnhaftigkeit.", "example": "„Ich fühlte mich erfüllt, als ich sah, wie meine Arbeit anderen Menschen geholfen hatte.“", "related": ["angenehm-niedrig-85", "angenehm-niedrig-66", "angenehm-niedrig-77", "angenehm-niedrig-76"]}, {"id": "angenehm-niedrig-69", "term": "Erleichtert", "valence": "angenehm", "arousal": "niedrig", "description": "„Erleichtert“ beschreibt einen emotionalen Zustand, in dem jemand nach einer Phase der Anspannung, Sorge oder Unsicherheit wieder Ruhe und Entspannung empfindet. Es ist ein Gefühl von Befreiung, das oft mit einem tiefen Atemzug oder einem Lächeln einhergeht.", "example": "„Ich war erleichtert, als der Arzt mir sagte, dass die Untersuchungsergebnisse unauffällig waren.“", "related": ["angenehm-niedrig-67", "angenehm-niedrig-85", "unangenehm-hoch-101", "angenehm-niedrig-66"]}, {"id": "angenehm-niedrig-70", "term": "Friedlich", "valence": "angenehm", "arousal": "niedrig", "description": "„Friedlich“ beschreibt einen emotionalen Zustand, in dem jemand sich ruhig, harmonisch und frei von Stress oder Konflikten fühlt. Es ist ein Gefühl von innerem Frieden und Ausgeglichenheit, das oft mit Entspannung und Zufriedenheit einhergeht.", "example": "„Ich fühlte mich friedlich, als ich am See saß und den sanften Klang der Wellen hörte.“", "related": ["angenehm-niedrig-80", "angenehm-niedrig-73", "angenehm-niedrig-64", "angenehm-niedrig-71"]}, {"id": "angenehm-niedrig-71", "term": "Geborgen", "valence": "angenehm", "arousal": "niedrig", "description": "„Geborgen“ beschreibt einen emotionalen Zustand, in dem jemand sich sicher, geschützt und innerlich ruhig fühlt. Es ist ein Gefühl von Vertrauen und Stabilität, das oft mit einem Ort, einer Person oder einer Situation verbunden ist, die Sicherheit vermittelt.", "example": "„In den Armen meiner Mutter fühlte ich mich geborgen und frei von allen Sorgen.“", "related": ["angenehm-hoch-8", "angenehm-niedrig-86", "angenehm-niedrig-74", "angenehm-niedrig-81"]}, {"id": "angenehm-niedrig-72", "term": "Geerdet", "valence": "angenehm", "arousal": "niedrig", "description": "„Geerdet“ beschreibt einen emotionalen Zustand, in dem jemand sich stabil, ruhig und fest mit der Realität verbunden fühlt. Es ist ein Gefühl von innerer Balance und Sicherheit, das oft mit Klarheit und Selbstbewusstsein einhergeht.", "example": "„Nach der Meditation fühlte ich mich geerdet und bereit, den Herausforderungen des Tages zu begegnen.“", "related": ["angenehm-hoch-50", "angenehm-niedrig-64", "angenehm-niedrig-81"]}, {"id": "angenehm-niedrig-73", "term": "Gelassen", "valence": "angenehm", "arousal": "niedrig", "description": "„Gelassen“ beschreibt einen emotionalen Zustand, in dem jemand entspannt, ruhig und innerlich ausgeglichen ist. Es ist ein Gefühl von Harmonie und Leichtigkeit, das oft mit einer friedlichen und sanften Ausstrahlung verbunden ist.", "example": "„Nach einem langen Urlaub fühlte ich mich vollkommen gelassen und konnte die kleinen Dinge des Lebens genießen.“", "related": ["angenehm-niedrig-80", "angenehm-niedrig-67", "angenehm-niedrig-64", "angenehm-niedrig-85"]}, {"id": "angenehm-niedrig-74", "term": "Geliebt", "valence": "angenehm", "arousal": "niedrig", "description": "„Geliebt“ beschreibt einen emotionalen Zustand, in dem jemand sich wertgeschätzt, umsorgt und tief verbunden mit anderen fühlt. Es ist ein Gefühl von Geborgenheit und Wärme, das oft mit Zuneigung, Anerkennung und emotionaler Nähe einhergeht.", "example": "„Ich fühlte mich geliebt, als meine Freunde sich die Zeit nahmen, mir in einer schwierigen Phase beizustehen.“", "related": ["angenehm-hoch-62", "angenehm-niedrig-71", "angenehm-niedrig-77", "angenehm-niedrig-82"]}, {"id": "angenehm-niedrig-75", "term": "Gesegnet", "valence": "angenehm", "arousal": "niedrig", "description": "„Gesegnet“ beschreibt einen emotionalen Zustand, in dem jemand sich dankbar, erfüllt und vom Leben reich beschenkt fühlt. Es ist ein Gefühl von tiefer Zufriedenheit und Wertschätzung, oft verbunden mit dem Eindruck, Glück oder besondere Gunst erfahren zu haben.", "example": "„Ich fühlte mich gesegnet, von so vielen lieben Menschen in meinem Leben umgeben zu sein.“", "related": ["angenehm-niedrig-66", "angenehm-niedrig-68", "angenehm-niedrig-85", "angenehm-niedrig-71", "angenehm-niedrig-82"]}, {"id": "angenehm-niedrig-76", "term": "Glückselig", "valence": "angenehm", "arousal": "niedrig", "description": "„Glückselig“ beschreibt einen emotionalen Zustand von tiefem, vollkommenem Glück und innerem Frieden. Es ist ein Gefühl von grenzenloser Freude und Harmonie, das oft in besonders schönen oder erfüllenden Momenten empfunden wird.", "example": "„Ich fühlte mich glückselig, als ich am Strand saß und den Sonnenuntergang beobachtete.“", "related": ["angenehm-niedrig-68", "angenehm-hoch-24", "angenehm-niedrig-85", "angenehm-niedrig-66"]}, {"id": "angenehm-niedrig-77", "term": "Liebend", "valence": "angenehm", "arousal": "niedrig", "description": "„Liebend“ beschreibt einen emotionalen Zustand, in dem jemand starke, wohlwollende und herzliche Zuneigung für eine Person oder Sache empfindet. Es ist ein Gefühl, das von Fürsorge, Wärme und oft auch von selbstloser Hingabe geprägt ist.", "example": "„Als ich ihn in den Arm nahm und spürte, wie glücklich er war, fühlte ich mich zutiefst liebend und verbunden.“", "related": ["angenehm-niedrig-78", "angenehm-hoch-63", "angenehm-niedrig-82", "angenehm-hoch-42", "angenehm-hoch-33"]}, {"id": "angenehm-niedrig-78", "term": "Liebevoll", "valence": "angenehm", "arousal": "niedrig", "description": "„Liebevoll“ beschreibt einen emotionalen Zustand, in dem jemand warmherzige Zuneigung, Fürsorge und Herzlichkeit zeigt oder empfindet. Es ist ein Gefühl von tiefer Verbundenheit und Wohlwollen, das sich in sanften Worten, Gesten oder Gedanken ausdrückt.", "example": "„Ich fühlte mich liebevoll, als ich meinem Kind eine Gute-Nacht-Geschichte vorlas.“", "related": ["angenehm-hoch-63", "angenehm-hoch-42", "angenehm-niedrig-86", "angenehm-niedrig-77"]}, {"id": "angenehm-niedrig-79", "term": "Nachdenklich", "valence": "angenehm", "arousal": "niedrig", "description": "„Nachdenklich“ beschreibt einen emotionalen Zustand, in dem jemand tief in Gedanken versunken ist, oft über wichtige oder bedeutungsvolle Themen. Es ist ein Gefühl von innerer Ruhe und Konzentration, das mit einer intensiven Reflexion oder Selbstbetrachtung einhergeht.", "example": "„Ich war nachdenklich, als ich den Sonnenuntergang betrachtete und über die letzten Monate meines Lebens reflektierte.“", "related": ["unangenehm-niedrig-160"]}, {"id": "angenehm-niedrig-80", "term": "Ruhig", "valence": "angenehm", "arousal": "niedrig", "description": "„Ruhig“ beschreibt einen emotionalen Zustand, in dem jemand sich gelassen, entspannt und frei von Unruhe oder Stress fühlt. Es ist ein Gefühl von innerer Ausgeglichenheit und Frieden, das oft mit Klarheit und Stabilität einhergeht.", "example": "„Ich fühlte mich ruhig, als ich den sanften Klang der Wellen hörte.“", "related": ["angenehm-niedrig-73", "angenehm-niedrig-67", "angenehm-niedrig-64", "angenehm-niedrig-70"]}, {"id": "angenehm-niedrig-81", "term": "Sicher", "valence": "angenehm", "arousal": "niedrig", "description": "„Sicher“ beschreibt einen emotionalen Zustand, in dem jemand sich geschützt, geborgen und frei von Angst oder Gefahr fühlt. Es ist ein Gefühl von Stabilität und Vertrauen, das oft mit Ruhe und innerer Ausgeglichenheit einhergeht.", "example": "„Ich fühlte mich sicher, als ich nach dem Sturm endlich zu Hause ankam.“", "related": ["angenehm-hoch-48", "angenehm-hoch-50", "angenehm-niedrig-71", "angenehm-niedrig-72"]}, {"id": "angenehm-niedrig-82", "term": "Verbunden", "valence": "angenehm", "arousal": "niedrig", "description": "„Verbunden“ beschreibt einen emotionalen Zustand, in dem jemand ein starkes Gefühl der Nähe, Zugehörigkeit oder Einheit mit einer Person, Gruppe oder Situation empfindet. Es ist ein Gefühl der Zusammengehörigkeit, das oft mit Vertrauen, Wärme und gegenseitigem Verständnis einhergeht.", "example": "„Als wir gemeinsam am Lagerfeuer saßen, fühlte ich mich tief mit meinen Freunden verbunden.“", "related": ["angenehm-niedrig-86", "angenehm-niedrig-71", "angenehm-niedrig-77", "angenehm-hoch-62"]}, {"id": "angenehm-niedrig-83", "term": "Vertieft", "valence": "angenehm", "arousal": "niedrig", "description": "„Vertieft“ beschreibt einen emotionalen Zustand, in dem jemand völlig in eine Tätigkeit, einen Gedanken oder eine Erfahrung eingetaucht ist. Es ist ein Gefühl intensiver Konzentration und Hingabe, bei dem die Außenwelt kaum noch wahrgenommen wird.", "example": "„Ich war so vertieft in das Buch, dass ich die Zeit völlig vergaß.“", "related": ["angenehm-niedrig-79"]}, {"id": "angenehm-niedrig-84", "term": "Wohl", "valence": "angenehm", "arousal": "niedrig", "description": "„Wohl“ beschreibt einen emotionalen Zustand, in dem jemand sich zufrieden, entspannt und innerlich ausgeglichen fühlt. Es ist ein Gefühl von Komfort und Zufriedenheit, das oft mit Harmonie und Ruhe einhergeht.", "example": "„Nach einem langen Spaziergang an der frischen Luft fühlte ich mich rundum wohl.“", "related": ["angenehm-niedrig-85", "angenehm-niedrig-71", "angenehm-hoch-8", "angenehm-niedrig-67", "angenehm-niedrig-64"]}, {"id": "angenehm-niedrig-85", "term": "Zufrieden", "valence": "angenehm", "arousal": "niedrig", "description": "„Zufriedenheit“ beschreibt einen emotionalen Zustand, in dem jemand mit sich selbst, einer Situation oder seinem Leben im Einklang ist und nichts Wesentliches vermisst. Es ist ein ruhiges, ausgleichendes Gefühl, das oft mit innerer Ruhe, Dankbarkeit und einem Gefühl der Vollständigkeit einhergeht.", "example": "„Als ich am Abend auf meiner Terrasse saß und den Sonnenuntergang beobachtete, spürte ich tiefe Zufriedenheit in mir.“", "related": ["angenehm-niedrig-64", "angenehm-niedrig-67", "angenehm-niedrig-84", "angenehm-niedrig-66", "angenehm-niedrig-73"]}, {"id": "angenehm-niedrig-86", "term": "Zugewandt", "valence": "angenehm", "arousal": "niedrig", "description": "„Zugewandt“ beschreibt einen emotionalen Zustand, in dem jemand aufmerksam, interessiert und offen auf eine andere Person oder Situation eingeht. Es ist ein Gefühl der Verbundenheit, das oft mit Empathie, Verständnis und Aufgeschlossenheit einhergeht.", "example": "„Ich fühlte mich ihm gegenüber zugewandt, als er mir von seinen Sorgen erzählte, und wollte ihm unbedingt helfen.“", "related": ["angenehm-hoch-42", "angenehm-hoch-4", "angenehm-niedrig-77"]}, {"id": "unangenehm-hoch-87", "term": "Abgeneigt", "valence": "unangenehm", "arousal": "hoch", "description": "„Abgeneigt“ beschreibt einen emotionalen Zustand, in dem jemand wenig Interesse oder sogar eine innere Ablehnung gegenüber einer Person, Situation oder Handlung empfindet. Es ist ein Gefühl von Widerwillen, das oft mit Zurückhaltung oder Unwillen verbunden ist.", "example": "„Ich fühlte mich abgeneigt, an der Diskussion teilzunehmen, da das Thema mich überhaupt nicht interessierte.“", "related": []}, {"id": "unangenehm-hoch-88", "term": "Alarmiert", "valence": "unangenehm", "arousal": "hoch", "description": "„Alarmiert“ beschreibt einen emotionalen Zustand, in dem jemand sich plötzlich wachsam, besorgt oder erschrocken fühlt, oft durch eine wahrgenommene Gefahr oder eine unerwartete Situation. Es ist ein Gefühl von Anspannung und erhöhter Aufmerksamkeit.", "example": "„Ich fühlte mich alarmiert, als ich eine beunruhigende Nachricht auf meinem Telefon erhielt.“", "related": ["unangenehm-hoch-101", "unangenehm-hoch-108", "unangenehm-hoch-91", "angenehm-hoch-60"]}, {"id": "unangenehm-hoch-89", "term": "Ambivalent", "valence": "unangenehm", "arousal": "hoch", "description": "„Ambivalent“ beschreibt einen emotionalen Zustand, in dem jemand gleichzeitig widersprüchliche Gefühle oder Meinungen zu einer Person, Situation oder Entscheidung hat. Es ist ein Gefühl von Unsicherheit und innerem Zwiespalt, das oft mit Nachdenklichkeit einhergeht.", "example": "„Ich fühlte mich ambivalent, als ich das Jobangebot erhielt – einerseits freute ich mich, andererseits war ich unsicher, ob es das Richtige für mich war.“", "related": ["unangenehm-hoch-133", "unangenehm-hoch-142", "angenehm-niedrig-79", "unangenehm-niedrig-182"]}, {"id": "unangenehm-hoch-90", "term": "Angepisst", "valence": "unangenehm", "arousal": "hoch", "description": "„Angepisst“ beschreibt einen emotionalen Zustand, in dem jemand sich genervt, verärgert oder leicht wütend fühlt, oft durch eine nervige oder respektlose Situation. Es ist ein informeller Ausdruck für Ärger, der jedoch meist weniger intensiv als echte Wut ist.", "example": "„Ich war angepisst, als ich zum dritten Mal auf eine verspätete Antwort warten musste.“", "related": ["unangenehm-hoch-114", "unangenehm-hoch-116", "unangenehm-hoch-137", "unangenehm-hoch-94", "unangenehm-hoch-140"]}, {"id": "unangenehm-hoch-91", "term": "Angespannt", "valence": "unangenehm", "arousal": "hoch", "description": "„Angespannt“ beschreibt einen emotionalen Zustand, in dem jemand sich gestresst, unter Druck oder innerlich unruhig fühlt, oft in einer belastenden oder konfliktgeladenen Situation. Es ist ein Gefühl von Spannung und Unsicherheit, das sowohl emotional als auch körperlich spürbar sein kann.", "example": "„Ich fühlte mich angespannt, als ich merkte, dass das Gespräch in eine unangenehme Richtung ging.“", "related": ["angenehm-niedrig-80", "unangenehm-hoch-116", "unangenehm-hoch-122", "unangenehm-hoch-99", "unangenehm-hoch-88"]}, {"id": "unangenehm-hoch-92", "term": "Angewidert", "valence": "unangenehm", "arousal": "hoch", "description": "„Angewidert“ beschreibt einen emotionalen Zustand, in dem jemand starke Abneigung und Abscheu empfindet, oft gegenüber etwas, das als ekelhaft, unangenehm oder moralisch verwerflich wahrgenommen wird. Es ist ein Gefühl, das häufig mit einem Reflex der Distanzierung oder Ablehnung einhergeht.", "example": "„Ich war angewidert, als ich von seinen respektlosen Kommentaren gegenüber anderen hörte.“", "related": ["unangenehm-hoch-107", "unangenehm-hoch-111"]}, {"id": "unangenehm-hoch-93", "term": "Ängstlich", "valence": "unangenehm", "arousal": "hoch", "description": "„Ängstlich“ beschreibt einen emotionalen Zustand, in dem jemand sich unsicher, bedroht oder besorgt fühlt, oft in Erwartung von etwas Unangenehmem oder Gefährlichem. Es ist ein Gefühl von innerer Anspannung und Alarmiertheit.", "example": "„Ich fühlte mich ängstlich, als ich alleine durch die dunkle Straße ging.“", "related": ["unangenehm-hoch-99", "unangenehm-hoch-122", "unangenehm-hoch-101", "unangenehm-hoch-136"]}, {"id": "unangenehm-hoch-94", "term": "Aufgebracht", "valence": "unangenehm", "arousal": "hoch", "description": "„Aufgebracht“ beschreibt einen emotionalen Zustand, in dem jemand stark verärgert, wütend oder innerlich aufgewühlt ist, oft als Reaktion auf eine kränkende oder provozierende Situation. Es ist ein Gefühl intensiver Erregung, das sich durch lautes, energisches oder impulsives Verhalten äußern kann.", "example": "„Ich war völlig aufgebracht, als der Autofahrer mir die Vorfahrt nahm und mich dabei noch beschimpfte.“", "related": ["unangenehm-hoch-140", "unangenehm-hoch-105", "unangenehm-hoch-106", "unangenehm-hoch-116", "unangenehm-hoch-137"]}, {"id": "unangenehm-hoch-95", "term": "Aufgewühlt", "valence": "unangenehm", "arousal": "hoch", "description": "„Aufgewühlt“ beschreibt einen emotionalen Zustand, in dem jemand sich innerlich unruhig, nervös oder gereizt fühlt, oft ausgelöst durch Stress, Angst oder eine beunruhigende Situation. Es ist ein Gefühl von emotionaler und körperlicher Anspannung.", "example": "„Ich war aufgewühlt, nachdem das unerwartete Gespräch so viele alte Konflikte wieder aufgewühlt hatte.“", "related": ["unangenehm-hoch-94", "angenehm-niedrig-80", "unangenehm-hoch-142", "unangenehm-hoch-109"]}, {"id": "unangenehm-hoch-96", "term": "Beklommen", "valence": "unangenehm", "arousal": "hoch", "description": "„Beklommen“ beschreibt einen emotionalen Zustand, in dem jemand sich innerlich bedrückt, ängstlich oder angespannt fühlt. Es ist ein Gefühl von Enge und Unwohlsein, das oft in unangenehmen oder bedrohlichen Situationen auftritt.", "example": "„Ich fühlte mich plötzlich beklommen, als ich in den dunklen, leeren Raum trat.“", "related": ["unangenehm-hoch-101", "unangenehm-hoch-93", "angenehm-niedrig-80", "unangenehm-hoch-134"]}, {"id": "unangenehm-hoch-97", "term": "Beschämt", "valence": "unangenehm", "arousal": "hoch", "description": "„Beschämt“ beschreibt einen emotionalen Zustand, in dem jemand sich aufgrund eines Fehlverhaltens, einer Peinlichkeit oder Kritik gedemütigt und unwohl fühlt. Es ist ein Gefühl von Scham und Verlegenheit, das oft mit dem Wunsch einhergeht, sich zurückzuziehen.", "example": "„Ich war beschämt, als mir klar wurde, dass ich mich vor allen im Ton vergriffen hatte.“", "related": ["unangenehm-hoch-138"]}, {"id": "unangenehm-hoch-98", "term": "Besessen", "valence": "unangenehm", "arousal": "hoch", "description": "„Besessen“ beschreibt einen emotionalen Zustand, in dem jemand sich intensiv und zwanghaft auf eine Person, Idee oder Aufgabe konzentriert, oft ohne die Fähigkeit, sich davon zu lösen. Es ist ein Gefühl von übermäßigem Interesse und Fixierung, das andere Gedanken oder Aktivitäten in den Hintergrund drängt.", "example": "„Ich war fast besessen davon, die perfekte Lösung für das Problem zu finden.“", "related": []}, {"id": "unangenehm-hoch-99", "term": "Besorgt", "valence": "unangenehm", "arousal": "hoch", "description": "„Besorgt“ beschreibt einen emotionalen Zustand, in dem jemand sich wegen einer möglichen Gefahr, eines Problems oder einer unsicheren Situation Sorgen macht. Es ist ein Gefühl von Unruhe und Nachdenklichkeit, das oft mit dem Wunsch verbunden ist, etwas zu verbessern oder zu schützen.", "example": "„Ich war besorgt, als mein Freund sich den ganzen Tag nicht gemeldet hat.“", "related": ["unangenehm-hoch-101", "unangenehm-hoch-93", "angenehm-niedrig-80", "unangenehm-hoch-96"]}, {"id": "unangenehm-hoch-100", "term": "Bestürzt", "valence": "unangenehm", "arousal": "hoch", "description": "„Bestürzt“ beschreibt einen emotionalen Zustand, in dem jemand sich tief beunruhigt, erschüttert oder überfordert fühlt, oft aufgrund einer belastenden oder schwierigen Situation. Es ist ein Gefühl von innerer Unruhe und Schmerz.", "example": "„Ich war bestürzt, als ich von den plötzlichen schlechten Nachrichten erfuhr.“", "related": ["unangenehm-hoch-111", "unangenehm-hoch-109", "unangenehm-niedrig-151", "unangenehm-hoch-107"]}, {"id": "unangenehm-hoch-101", "term": "Beunruhigt", "valence": "unangenehm", "arousal": "hoch", "description": "„Beunruhigt“ beschreibt einen emotionalen Zustand, in dem jemand Sorgen, Unruhe oder Angst empfindet, oft wegen einer unklaren oder potenziell negativen Situation. Es ist ein Gefühl innerer Anspannung, das von Gedanken an mögliche Gefahren oder Probleme begleitet wird.", "example": "„Ich war beunruhigt, als ich hörte, dass der Arzt noch weitere Untersuchungen machen wollte.“", "related": ["unangenehm-hoch-99", "unangenehm-hoch-91", "angenehm-niedrig-80", "unangenehm-hoch-96", "unangenehm-hoch-88"]}, {"id": "unangenehm-hoch-102", "term": "Dünnhäutig", "valence": "unangenehm", "arousal": "hoch", "description": "„Dünnhäutig“ beschreibt einen emotionalen Zustand, in dem jemand besonders empfindlich auf Kritik, negative Bemerkungen oder äußere Einflüsse reagiert. Es ist ein Gefühl von erhöhter Verletzlichkeit, das oft mit Unsicherheit und schneller Kränkbarkeit einhergeht.", "example": "„Nach den anstrengenden Wochen fühlte ich mich dünnhäutig und nahm jede kleine Bemerkung zu persönlich.“", "related": ["unangenehm-niedrig-177", "unangenehm-hoch-116"]}, {"id": "unangenehm-hoch-103", "term": "Dysreguliert", "valence": "unangenehm", "arousal": "hoch", "description": "„Dysreguliert“ beschreibt einen emotionalen Zustand, in dem jemand Schwierigkeiten hat, seine Gefühle oder Reaktionen zu kontrollieren oder auszugleichen. Es ist ein Gefühl von innerer Unordnung, das oft mit impulsivem Verhalten, Überforderung oder stark schwankenden Emotionen einhergeht.", "example": "„Ich fühlte mich emotional dysreguliert, als die Situation außer Kontrolle geriet und ich nicht wusste, wie ich reagieren sollte.“", "related": ["unangenehm-hoch-118", "unangenehm-hoch-95", "unangenehm-hoch-142", "unangenehm-hoch-128"]}, {"id": "unangenehm-hoch-104", "term": "Eifersüchtig", "valence": "unangenehm", "arousal": "hoch", "description": "„Eifersüchtig“ beschreibt einen emotionalen Zustand, in dem jemand Angst oder Unzufriedenheit empfindet, weil er eine wichtige Beziehung oder Aufmerksamkeit mit einer anderen Person teilen muss. Es ist ein Gefühl von Unsicherheit, Konkurrenz und manchmal Besitzdenken.", "example": "„Ich fühlte mich eifersüchtig, als sie mehr Zeit mit ihrem neuen Freund als mit mir verbrachte.“", "related": ["unangenehm-hoch-121", "unangenehm-hoch-133"]}, {"id": "unangenehm-hoch-105", "term": "Empört", "valence": "unangenehm", "arousal": "hoch", "description": "„Empört“ beschreibt einen emotionalen Zustand, in dem jemand stark verärgert und aufgebracht ist, weil er etwas als ungerecht, respektlos oder moralisch falsch empfindet. Es ist ein intensives Gefühl von Ablehnung und Unverständnis, das oft mit dem Drang verbunden ist, sich dagegen zu wehren oder seine Meinung deutlich zu äußern.", "example": "„Ich war empört, als ich erfuhr, dass man versucht hatte, die wichtigen Informationen vor uns zu verheimlichen.“", "related": ["unangenehm-hoch-106", "unangenehm-hoch-94", "unangenehm-hoch-137", "unangenehm-hoch-111", "unangenehm-hoch-140"]}, {"id": "unangenehm-hoch-106", "term": "Entrüstet", "valence": "unangenehm", "arousal": "hoch", "description": "„Entrüstet“ beschreibt einen emotionalen Zustand, in dem jemand sich empört, aufgebracht oder verärgert fühlt, oft als Reaktion auf etwas, das als ungerecht, respektlos oder unmoralisch empfunden wird. Es ist ein Gefühl, das mit starker Ablehnung und manchmal mit lautstarkem Protest einhergeht.", "example": "„Ich war entrüstet, als ich hörte, wie unfair mein Freund behandelt worden war.“", "related": ["unangenehm-hoch-105", "unangenehm-hoch-94", "unangenehm-hoch-137", "unangenehm-hoch-111", "unangenehm-hoch-140"]}, {"id": "unangenehm-hoch-107", "term": "Entsetzt", "valence": "unangenehm", "arousal": "hoch", "description": "„Entsetzt“ beschreibt einen emotionalen Zustand, in dem jemand von Schrecken, Angst oder Abscheu überwältigt ist, oft ausgelöst durch etwas Schockierendes oder Grauenvolles. Es ist ein intensives Gefühl von Furcht und Abwehr.", "example": "„Ich war entsetzt, als ich die Nachrichten über die Katastrophe hörte.“", "related": ["unangenehm-hoch-109", "unangenehm-hoch-111", "unangenehm-hoch-100", "unangenehm-hoch-92"]}, {"id": "unangenehm-hoch-108", "term": "Erschrocken", "valence": "unangenehm", "arousal": "hoch", "description": "„Erschrocken“ beschreibt einen emotionalen Zustand, in dem jemand durch etwas Plötzliches oder Unerwartetes Angst oder Schrecken empfindet. Es ist ein Gefühl von momentaner Alarmiertheit, das oft mit einem körperlichen Zusammenzucken oder einem schnellen Herzschlag einhergeht.", "example": "„Ich war erschrocken, als plötzlich ein lauter Knall die Stille durchbrach.“", "related": ["unangenehm-hoch-136", "unangenehm-hoch-100", "unangenehm-hoch-88"]}, {"id": "unangenehm-hoch-109", "term": "Erschüttert", "valence": "unangenehm", "arousal": "hoch", "description": "„Erschüttert“ beschreibt einen emotionalen Zustand, in dem jemand sich tief betroffen, aufgewühlt oder innerlich bewegt fühlt, oft durch ein schockierendes oder traumatisches Ereignis. Es ist ein Gefühl von emotionaler Unruhe und innerer Erschütterung.", "example": "„Ich war erschüttert, als ich von dem plötzlichen Unfall meines Freundes erfuhr.“", "related": ["unangenehm-hoch-100", "unangenehm-hoch-111", "unangenehm-hoch-107", "unangenehm-niedrig-151", "unangenehm-niedrig-172"]}, {"id": "unangenehm-hoch-110", "term": "Ertappt", "valence": "unangenehm", "arousal": "hoch", "description": "„Ertappt“ beschreibt einen emotionalen Zustand, in dem jemand überrascht und oft peinlich berührt ist, weil ein eigenes Fehlverhalten oder eine Absicht von anderen bemerkt wurde. Es ist ein Gefühl, das mit Scham, Nervosität oder Unsicherheit einhergeht.", "example": "„Ich fühlte mich ertappt, als mein Chef bemerkte, dass ich während der Besprechung auf mein Handy geschaut hatte.“", "related": ["unangenehm-hoch-97", "unangenehm-hoch-138"]}, {"id": "unangenehm-hoch-111", "term": "Fassunglos", "valence": "unangenehm", "arousal": "hoch", "description": "„Fassungslos“ beschreibt einen emotionalen Zustand, in dem jemand durch etwas Unerwartetes oder Unglaubliches so überrascht ist, dass er sprachlos oder überwältigt reagiert. Es ist ein Gefühl von Staunen und Unglauben.", "example": "„Ich war fassungslos, als ich die unerwartet hohen Kosten für die Reparatur sah.“", "related": ["angenehm-hoch-49", "unangenehm-hoch-100", "unangenehm-hoch-107", "unangenehm-hoch-123", "unangenehm-hoch-109"]}, {"id": "unangenehm-hoch-112", "term": "Frustriert", "valence": "unangenehm", "arousal": "hoch", "description": "„Frustriert“ beschreibt einen emotionalen Zustand, in dem jemand sich enttäuscht, genervt oder entmutigt fühlt, weil ein Ziel, eine Erwartung oder ein Wunsch nicht erreicht wurde. Es ist ein Gefühl von innerem Widerstand, das oft mit Gereiztheit oder Resignation einhergeht.", "example": "„Ich war frustriert, als mein Computer mitten in der Arbeit abstürzte und ich alles neu machen musste.“", "related": ["unangenehm-niedrig-155", "unangenehm-hoch-114", "unangenehm-hoch-116"]}, {"id": "unangenehm-hoch-113", "term": "Gehetzt", "valence": "unangenehm", "arousal": "hoch", "description": "„Gehetzt“ beschreibt einen emotionalen Zustand, in dem jemand sich unter Zeitdruck und Stress fühlt, oft aufgrund einer Vielzahl von Aufgaben oder einer knappen Deadline. Es ist ein Gefühl von Anspannung und Überforderung, das häufig zu Unruhe und Hektik führt.", "example": "„Ich fühlte mich gehetzt, als ich versuchte, alle Aufgaben vor dem Meeting zu erledigen.“", "related": ["unangenehm-hoch-117", "unangenehm-niedrig-169", "angenehm-niedrig-80"]}, {"id": "unangenehm-hoch-114", "term": "Genervt", "valence": "unangenehm", "arousal": "hoch", "description": "„Genervt“ beschreibt einen emotionalen Zustand, in dem jemand sich durch eine Person, eine Situation oder wiederholte Reize gestört und gereizt fühlt. Es ist ein Gefühl von Unbehagen und Ungeduld, das oft mit einem Wunsch nach Ruhe oder Veränderung der Situation einhergeht.", "example": "„Ich war genervt, als mein Nachbar zum dritten Mal an diesem Abend laut Musik spielte.“", "related": ["unangenehm-hoch-116", "unangenehm-hoch-119", "unangenehm-hoch-132", "unangenehm-hoch-120", "unangenehm-hoch-112"]}, {"id": "unangenehm-hoch-115", "term": "Gequält", "valence": "unangenehm", "arousal": "hoch", "description": "„Gequält“ beschreibt einen emotionalen Zustand, in dem jemand tiefen seelischen Schmerz, Leid und Verzweiflung empfindet. Es ist ein Gefühl von intensiver innerer Qual, das oft mit Traurigkeit oder Hilflosigkeit einhergeht.", "example": "„Ich fühlte mich gequält, als ich an den Verlust meines besten Freundes dachte.“", "related": ["unangenehm-niedrig-180", "unangenehm-hoch-97"]}, {"id": "unangenehm-hoch-116", "term": "Gereizt", "valence": "unangenehm", "arousal": "hoch", "description": "„Gereizt“ beschreibt einen emotionalen Zustand, in dem jemand schnell ärgerlich oder empfindlich auf äußere Reize oder Situationen reagiert. Es ist ein Gefühl innerer Anspannung, das oft mit Ungeduld, scharfen Reaktionen oder einer niedrigen Reizschwelle einhergeht.", "example": "„Ich war heute so gereizt, dass mich schon kleine Nachfragen aus der Ruhe brachten.“", "related": ["unangenehm-hoch-114", "unangenehm-hoch-132", "unangenehm-hoch-112", "unangenehm-hoch-91", "unangenehm-hoch-140"]}, {"id": "unangenehm-hoch-117", "term": "Gestresst", "valence": "unangenehm", "arousal": "hoch", "description": "„Gestresst“ beschreibt einen emotionalen Zustand, in dem jemand sich überfordert, unter Druck und nervös fühlt, oft aufgrund hoher Anforderungen oder Zeitdruck. Es ist ein Gefühl von Anspannung, das sowohl körperliche als auch mentale Belastung mit sich bringt.", "example": "„Ich fühlte mich gestresst, als ich versuchte, mehrere dringende Aufgaben gleichzeitig zu erledigen.“", "related": ["unangenehm-hoch-91", "angenehm-niedrig-80", "unangenehm-hoch-114"]}, {"id": "unangenehm-hoch-118", "term": "Instabil", "valence": "unangenehm", "arousal": "hoch", "description": "„Instabil“ beschreibt einen emotionalen Zustand, in dem jemand sich unsicher, unberechenbar oder emotional schwankend fühlt. Es ist ein Gefühl von mangelnder Kontrolle über die eigenen Emotionen, das oft mit innerer Unruhe und Anspannung einhergeht.", "example": "„Ich fühlte mich emotional instabil, weil meine Stimmung ständig zwischen Freude und Traurigkeit schwankte.“", "related": ["unangenehm-hoch-133", "unangenehm-hoch-142", "unangenehm-hoch-103", "unangenehm-niedrig-181"]}, {"id": "unangenehm-hoch-119", "term": "Irritiert", "valence": "unangenehm", "arousal": "hoch", "description": "„Irritiert“ beschreibt einen emotionalen Zustand, in dem jemand sich durch etwas Unerwartetes oder Unangenehmes verwirrt, gestört oder leicht verärgert fühlt. Es ist ein Gefühl von Unsicherheit oder leichter Verärgerung, das oft mit Nachdenken oder Zurückhaltung einhergeht.", "example": "„Ich war irritiert, als er mitten im Gespräch plötzlich das Thema wechselte.“", "related": ["unangenehm-hoch-139", "unangenehm-hoch-114", "unangenehm-hoch-123"]}, {"id": "unangenehm-hoch-120", "term": "Missvergnügt", "valence": "unangenehm", "arousal": "hoch", "description": "„Missvergnügt“ beschreibt einen emotionalen Zustand, in dem jemand unzufrieden, leicht verärgert oder schlecht gelaunt ist. Es ist ein Gefühl von innerem Unbehagen oder Verstimmung, das sich oft in mürrischem oder zurückhaltendem Verhalten äußert.", "example": "„Ich war missvergnügt, als ich feststellte, dass mein Zug schon wieder Verspätung hatte.“", "related": ["unangenehm-niedrig-166", "unangenehm-hoch-116", "unangenehm-niedrig-175"]}, {"id": "unangenehm-hoch-121", "term": "Neidisch", "valence": "unangenehm", "arousal": "hoch", "description": "„Neidisch“ beschreibt einen emotionalen Zustand, in dem jemand sich danach sehnt, etwas zu besitzen oder zu erreichen, was eine andere Person hat, und sich dadurch minderwertig oder unzufrieden fühlt. Es ist ein Gefühl von Unbehagen und Vergleich.", "example": "„Ich fühlte mich neidisch, als ich sah, wie erfolgreich sie in ihrem neuen Job war.“", "related": ["unangenehm-hoch-104", "unangenehm-hoch-112", "unangenehm-niedrig-175"]}, {"id": "unangenehm-hoch-122", "term": "Nervös", "valence": "unangenehm", "arousal": "hoch", "description": "„Nervös“ beschreibt einen emotionalen Zustand, in dem jemand sich unruhig, angespannt oder leicht ängstlich fühlt, oft begleitet von körperlicher Anspannung wie Zittern oder schneller Atmung. Es ist ein Gefühl von Unsicherheit und innerer Unruhe.", "example": "„Ich fühlte mich nervös, als ich auf meinen Namen für die Präsentation wartete.“", "related": ["unangenehm-hoch-91", "angenehm-niedrig-80", "unangenehm-hoch-93"]}, {"id": "unangenehm-hoch-123", "term": "Perplex", "valence": "unangenehm", "arousal": "hoch", "description": "„Perplex“ beschreibt einen emotionalen Zustand, in dem jemand durch etwas Unerwartetes oder Unverständliches völlig verwirrt, sprachlos oder unsicher ist. Es ist ein Gefühl von Überforderung, bei dem man für einen Moment nicht weiß, wie man reagieren soll.", "example": "„Ich war perplex, als mein Chef mich ohne jede Vorwarnung um eine Präsentation bat.“", "related": ["unangenehm-hoch-139", "unangenehm-hoch-111", "unangenehm-hoch-119", "angenehm-hoch-49"]}, {"id": "unangenehm-hoch-124", "term": "Ruhelos", "valence": "unangenehm", "arousal": "hoch", "description": "„Ruhelos“ beschreibt einen emotionalen Zustand, in dem jemand sich innerlich unruhig, nervös oder getrieben fühlt, oft ohne genau zu wissen, warum. Es ist ein Gefühl von Anspannung und Rastlosigkeit, das sich durch ständiges Bewegen oder das Bedürfnis, etwas zu tun, äußern kann.", "example": "„Ich war ruhelos und konnte mich einfach nicht entspannen, obwohl ich nichts Dringendes zu tun hatte.“", "related": ["angenehm-niedrig-80", "unangenehm-hoch-91", "unangenehm-hoch-122"]}, {"id": "unangenehm-hoch-125", "term": "Sauer", "valence": "unangenehm", "arousal": "hoch", "description": "„Sauer“ beschreibt einen emotionalen Zustand, in dem jemand ärgerlich, gekränkt oder verärgert ist, oft aufgrund einer Enttäuschung, eines Fehlverhaltens oder einer unangenehmen Situation. Es ist ein Gefühl, das sich durch zurückgezogenes oder gereiztes Verhalten äußern kann.", "example": "„Ich war richtig sauer, als mein Kollege unsere Verabredung ohne Erklärung absagte.“", "related": ["unangenehm-hoch-137", "unangenehm-hoch-114", "unangenehm-hoch-116", "unangenehm-hoch-94", "unangenehm-hoch-140"]}, {"id": "unangenehm-hoch-126", "term": "Sprachlos", "valence": "unangenehm", "arousal": "hoch", "description": "„Sprachlos“ beschreibt einen emotionalen Zustand, in dem jemand so überrascht, beeindr
