uckt oder überwältigt ist, dass die Worte fehlen. Es ist ein Gefühl, das oft mit Staunen, Schock oder intensiver Rührung einhergeht.", "example": "„Ich war völlig sprachlos, als ich die atemberaubende Aussicht vom Gipfel aus sah.“", "related": ["unangenehm-hoch-111", "unangenehm-hoch-100", "unangenehm-hoch-123", "unangenehm-hoch-129"]}, {"id": "unangenehm-hoch-127", "term": "Töricht", "valence": "unangenehm", "arousal": "hoch", "description": "„Töricht“ beschreibt einen emotionalen Zustand, in dem jemand sich wegen einer unüberlegten oder naiven Handlung dumm oder unklug fühlt. Es ist ein Gefühl von Scham oder Bedauern über eine eigene Entscheidung oder ein Verhalten.", "example": "„Ich fühlte mich töricht, als mir klar wurde, dass ich auf den offensichtlichen Trick hereingefallen war.“", "related": []}, {"id": "unangenehm-hoch-128", "term": "Überdreht", "valence": "unangenehm", "arousal": "hoch", "description": "„Überdreht“ beschreibt einen emotionalen Zustand, in dem jemand sich übermäßig energiegeladen, aufgeregt oder nervös fühlt. Es ist ein Gefühl von hoher Aktivität, oft begleitet von Unruhe oder Impulsivität.", "example": "„Ich war total überdreht, nachdem ich viel zu viel Kaffee getrunken hatte.“", "related": ["unangenehm-hoch-124", "angenehm-hoch-3"]}, {"id": "unangenehm-hoch-129", "term": "Überwältigt", "valence": "unangenehm", "arousal": "hoch", "description": "„Überwältigt“ beschreibt einen emotionalen Zustand, in dem jemand sich von einer Situation, einer Aufgabe oder von Emotionen überfordert fühlt. Es ist ein Gefühl von Kontrollverlust und Überladung, das oft mit innerer Anspannung und Hilflosigkeit einhergeht.", "example": "„Ich fühlte mich überwältigt, als so viele Dinge gleichzeitig meine Aufmerksamkeit forderten.“", "related": ["unangenehm-hoch-111", "unangenehm-hoch-109", "angenehm-hoch-7"]}, {"id": "unangenehm-hoch-130", "term": "Unangenehm berührt", "valence": "unangenehm", "arousal": "hoch", "description": "„Unangenehm berührt“ beschreibt einen emotionalen Zustand, in dem jemand sich durch eine Situation oder Bemerkung peinlich, unwohl oder beschämt fühlt. Es ist ein Gefühl von innerem Unbehagen, das oft mit Verlegenheit oder Zurückhaltung einhergeht.", "example": "„Ich war unangenehm berührt, als er vor allen laut über meinen kleinen Fehler sprach.“", "related": ["unangenehm-hoch-138", "unangenehm-hoch-96", "unangenehm-hoch-131", "unangenehm-hoch-119"]}, {"id": "unangenehm-hoch-131", "term": "Unbehaglich", "valence": "unangenehm", "arousal": "hoch", "description": "„Unbehaglich“ beschreibt einen emotionalen Zustand, in dem jemand sich unwohl, unsicher oder leicht gestört fühlt, oft durch eine unangenehme oder bedrückende Situation. Es ist ein Gefühl von innerer Unruhe, das mit dem Wunsch einhergeht, die Situation zu verlassen oder zu verändern.", "example": "„Ich fühlte mich unbehaglich, als ich merkte, dass mich alle im Raum anstarrten.“", "related": ["unangenehm-hoch-134", "unangenehm-hoch-96", "unangenehm-hoch-138", "unangenehm-hoch-91"]}, {"id": "unangenehm-hoch-132", "term": "Ungehalten", "valence": "unangenehm", "arousal": "hoch", "description": "„Ungehalten“ beschreibt einen emotionalen Zustand, in dem jemand ärgerlich, ungeduldig oder leicht gereizt ist, oft weil eine Situation oder ein Verhalten als störend oder unangemessen empfunden wird. Es ist ein Gefühl, das sich in scharfen Worten oder gereiztem Verhalten äußern kann.", "example": "„Ich wurde ungehalten, als die Besprechung zum dritten Mal ohne Ergebnis verschoben wurde.“", "related": ["unangenehm-hoch-116", "unangenehm-hoch-137", "unangenehm-niedrig-165", "unangenehm-hoch-94", "unangenehm-hoch-140"]}, {"id": "unangenehm-hoch-133", "term": "Unsicher", "valence": "unangenehm", "arousal": "hoch", "description": "„Unsicher“ beschreibt einen emotionalen Zustand, in dem jemand Zweifel oder Angst empfindet und sich in einer Situation oder Entscheidung nicht sicher fühlt. Es ist ein Gefühl von Unentschlossenheit oder mangelndem Vertrauen, das oft mit Zurückhaltung oder Nervosität einhergeht.", "example": "„Ich fühlte mich unsicher, ob ich die richtige Entscheidung getroffen hatte.“", "related": ["unangenehm-niedrig-182", "unangenehm-hoch-118"]}, {"id": "unangenehm-hoch-134", "term": "Unwohl", "valence": "unangenehm", "arousal": "hoch", "description": "„Unwohl“ beschreibt einen emotionalen Zustand, in dem jemand sich unangenehm, unbehaglich oder leicht abgestoßen fühlt, oft durch eine unangenehme Situation oder Umgebung. Es ist ein Gefühl von innerem Unbehagen oder Ekel.", "example": "„Ich fühlte mich unwohl, als das Gespräch plötzlich in eine seltsame Richtung ging.“", "related": ["unangenehm-hoch-131", "unangenehm-hoch-96", "unangenehm-hoch-99", "unangenehm-hoch-116", "unangenehm-hoch-91"]}, {"id": "unangenehm-hoch-135", "term": "Verächtlich", "valence": "unangenehm", "arousal": "hoch", "description": "„Verächtlich“ beschreibt einen emotionalen Zustand, in dem jemand starke Abneigung oder Geringschätzung gegenüber einer Person oder Sache empfindet. Es ist ein Gefühl von Überlegenheit und Ablehnung, das sich oft in Worten, Blicken oder Gesten ausdrückt.", "example": "„Ich schnaubte verächtlich, als er versuchte, seine offensichtliche Lüge zu rechtfertigen.“", "related": []}, {"id": "unangenehm-hoch-136", "term": "Verängstigt", "valence": "unangenehm", "arousal": "hoch", "description": "„Verängstigt“ beschreibt einen emotionalen Zustand, in dem jemand durch eine bedrohliche oder beunruhigende Situation starke Angst empfindet. Es ist ein Gefühl von Unsicherheit und Schutzbedürftigkeit, das oft mit Zittern, Rückzug oder Nervosität einhergeht.", "example": "„Ich fühlte mich verängstigt, als ich in der Dunkelheit Schritte hinter mir hörte.“", "related": ["unangenehm-hoch-93", "unangenehm-hoch-108", "unangenehm-hoch-96", "unangenehm-hoch-101"]}, {"id": "unangenehm-hoch-137", "term": "Verärgert", "valence": "unangenehm", "arousal": "hoch", "description": "„Verärgert“ beschreibt einen emotionalen Zustand, in dem jemand sich über eine störende oder unangenehme Situation ärgert. Es ist ein Gefühl von Unzufriedenheit oder Irritation, das oft mit kritischen Gedanken oder zurückhaltendem Verhalten einhergeht.", "example": "„Ich war verärgert, als mein Paket erneut verspätet geliefert wurde.“", "related": ["unangenehm-hoch-114", "unangenehm-hoch-116", "unangenehm-hoch-132", "unangenehm-hoch-112", "unangenehm-hoch-94"]}, {"id": "unangenehm-hoch-138", "term": "Verlegen", "valence": "unangenehm", "arousal": "hoch", "description": "„Verlegen“ beschreibt einen emotionalen Zustand, in dem jemand sich unsicher, peinlich berührt oder unangenehm berührt fühlt, oft in einer unerwarteten oder unangenehmen Situation. Es ist ein Gefühl, das mit Nervosität, leichtem Unbehagen und manchmal auch Erröten einhergeht.", "example": "„Ich wurde verlegen, als alle plötzlich anfingen, mich für meinen Erfolg zu loben.“", "related": ["unangenehm-hoch-133", "unangenehm-hoch-97", "unangenehm-hoch-119", "unangenehm-hoch-131"]}, {"id": "unangenehm-hoch-139", "term": "Verwirrt", "valence": "unangenehm", "arousal": "hoch", "description": "„Verwirrt“ beschreibt einen emotionalen Zustand, in dem jemand sich unsicher, orientierungslos oder überfordert fühlt, oft weil eine Situation oder Information unklar oder widersprüchlich ist. Es ist ein Gefühl von innerer Unordnung und Unentschlossenheit.", "example": "„Ich fühlte mich verwirrt, als ich die Anweisungen nicht richtig verstand.“", "related": ["unangenehm-hoch-119", "unangenehm-hoch-133", "unangenehm-niedrig-169", "unangenehm-hoch-123"]}, {"id": "unangenehm-hoch-140", "term": "Wütend", "valence": "unangenehm", "arousal": "hoch", "description": "Wütend“ beschreibt einen emotionalen Zustand intensiver Ärger und Empörung, in dem jemand stark auf eine als unfair, verletzend oder provozierend empfundene Situation reagiert. Es ist ein kraftvolles, aufbrausendes Gefühl, das sich oft in lautem oder impulsivem Verhalten äußert.", "example": "„Ich war wütend, als ich erfuhr, dass man mich bei der wichtigen Entscheidung übergangen hatte.“", "related": ["unangenehm-hoch-94", "unangenehm-hoch-105", "unangenehm-hoch-143", "unangenehm-hoch-116", "unangenehm-hoch-141"]}, {"id": "unangenehm-hoch-141", "term": "Wutentbrannt", "valence": "unangenehm", "arousal": "hoch", "description": "„Wutentbrannt“ beschreibt einen emotionalen Zustand intensiver und ungezügelter Wut, in dem jemand stark aufgebracht und außer sich ist. Es ist ein Gefühl von explosiver Ärger, das sich oft in lauten Worten oder impulsiven Handlungen ausdrückt.", "example": "„Ich war wutentbrannt, als ich entdeckte, dass er mein Fahrrad mutwillig beschädigt hatte.“", "related": ["unangenehm-hoch-143", "unangenehm-hoch-94", "unangenehm-hoch-105"]}, {"id": "unangenehm-hoch-142", "term": "Zerrissen", "valence": "unangenehm", "arousal": "hoch", "description": "„Zerrissen“ beschreibt einen emotionalen Zustand, in dem jemand sich innerlich hin- und hergerissen fühlt, weil er zwischen widersprüchlichen Gefühlen, Meinungen oder Entscheidungen steht. Es ist ein Gefühl von Unsicherheit und innerem Zwiespalt.", "example": "„Ich fühlte mich zerrissen, als ich entscheiden musste, ob ich in meiner Heimatstadt bleiben oder für den Job wegziehen sollte.“", "related": ["unangenehm-hoch-89", "unangenehm-hoch-103", "unangenehm-hoch-118", "unangenehm-hoch-95"]}, {"id": "unangenehm-hoch-143", "term": "Zornig", "valence": "unangenehm", "arousal": "hoch", "description": "„Zornig“ beschreibt einen emotionalen Zustand starker und tief empfundener Wut, oft ausgelöst durch Ungerechtigkeit, Kränkung oder Provokation. Es ist ein intensives Gefühl von Ärger, das sich durch heftige Worte, Gesten oder innere Anspannung ausdrücken kann.", "example": "„Ich war zornig, als ich sah, wie er absichtlich jemanden verletzte und so tat, als wäre nichts passiert.“", "related": ["unangenehm-hoch-140", "unangenehm-hoch-94", "unangenehm-hoch-105", "unangenehm-hoch-141"]}, {"id": "unangenehm-niedrig-144", "term": "Abgelenkt", "valence": "unangenehm", "arousal": "niedrig", "description": "„Abgelenkt“ beschreibt einen emotionalen Zustand, in dem jemand seine Aufmerksamkeit nicht auf eine bestimmte Aufgabe oder Situation richten kann, weil Gedanken, Gefühle oder äußere Einflüsse stören. Es ist ein Gefühl von Zerstreutheit und fehlender Konzentration.", "example": "„Ich war so abgelenkt von dem Gedanken an die nächste Woche, dass ich mich kaum auf meine Arbeit konzentrieren konnte.“", "related": ["angenehm-niedrig-80"]}, {"id": "unangenehm-niedrig-145", "term": "Bedrückt", "valence": "unangenehm", "arousal": "niedrig", "description": "„Bedrückt“ beschreibt einen emotionalen Zustand, in dem jemand sich niedergeschlagen, sorgenvoll oder innerlich belastet fühlt. Es ist ein Gefühl von Traurigkeit oder Unwohlsein, das oft durch belastende Gedanken oder eine schwierige Situation ausgelöst wird.", "example": "„Ich fühlte mich bedrückt, als ich an die bevorstehende schwere Entscheidung dachte.“", "related": ["unangenehm-niedrig-167", "unangenehm-niedrig-172", "unangenehm-niedrig-146"]}, {"id": "unangenehm-niedrig-146", "term": "Bekümmert", "valence": "unangenehm", "arousal": "niedrig", "description": "„Bekümmert“ beschreibt einen emotionalen Zustand, in dem jemand sich traurig, besorgt oder innerlich belastet fühlt. Es ist ein Gefühl von Kummer und Nachdenklichkeit, das oft durch persönliche Sorgen oder schwierige Situationen ausgelöst wird.", "example": "„Ich war bekümmert, als ich von den Problemen meines Freundes erfuhr und nicht wusste, wie ich helfen sollte.“", "related": ["unangenehm-niedrig-172", "unangenehm-niedrig-145", "unangenehm-niedrig-167", "unangenehm-niedrig-180"]}, {"id": "unangenehm-niedrig-147", "term": "Belastet", "valence": "unangenehm", "arousal": "niedrig", "description": "„Belastet“ beschreibt einen emotionalen Zustand, in dem jemand sich von Sorgen, Pflichten oder Verantwortung schwer belastet und überwältigt fühlt. Es ist ein Gefühl von innerem Druck und Anstrengung, das oft mit Erschöpfung oder Stress einhergeht.", "example": "„Ich fühlte mich belastet, weil so viele Aufgaben auf einmal auf mich zukamen.“", "related": ["unangenehm-hoch-117", "unangenehm-niedrig-167"]}, {"id": "unangenehm-niedrig-148", "term": "Bemitleidenswert", "valence": "unangenehm", "arousal": "niedrig", "description": "„Bemitleidenswert“ beschreibt einen emotionalen Zustand, in dem jemand sich schwach, unzulänglich oder wertlos fühlt, oft in Verbindung mit Scham oder Selbstzweifeln. Es ist ein Gefühl von Selbstkritik und Niedergeschlagenheit.", "example": "„Ich fühlte mich bemitleidenswert, als ich merkte, dass ich meine Aufgaben nicht alleine bewältigen konnte.“", "related": ["unangenehm-niedrig-158"]}, {"id": "unangenehm-niedrig-149", "term": "Beraubt", "valence": "unangenehm", "arousal": "niedrig", "description": "„Beraubt“ beschreibt einen emotionalen Zustand, in dem jemand sich eines wichtigen Menschen, Gefühls oder Aspekts seines Lebens enthoben fühlt. Es ist ein Gefühl von Verlust und innerer Leere, das oft mit Schmerz und Hilflosigkeit einhergeht.", "example": "„Ich fühlte mich beraubt, als mir klar wurde, dass ich die Chance, meinen Traum zu verwirklichen, verpasst hatte.“", "related": ["unangenehm-niedrig-155", "unangenehm-hoch-109"]}, {"id": "unangenehm-niedrig-150", "term": "Besorgt", "valence": "unangenehm", "arousal": "niedrig", "description": "„Besorgt“ beschreibt einen emotionalen Zustand, in dem jemand sich wegen einer möglichen Gefahr, eines Problems oder einer unsicheren Situation Sorgen macht. Es ist ein Gefühl von Unruhe und Nachdenklichkeit, das oft mit dem Wunsch verbunden ist, etwas zu verbessern oder zu schützen.", "example": "„Ich war besorgt, als mein Freund sich den ganzen Tag nicht gemeldet hat.“", "related": ["unangenehm-hoch-93", "angenehm-niedrig-79", "unangenehm-hoch-133", "unangenehm-hoch-101"]}, {"id": "unangenehm-niedrig-151", "term": "Betroffen", "valence": "unangenehm", "arousal": "niedrig", "description": "„Betroffen“ beschreibt einen emotionalen Zustand, in dem jemand tief bewegt, schockiert oder nachdenklich ist, oft aufgrund von etwas Unerwartetem, Traurigem oder Unangenehmem. Es ist ein Gefühl von innerer Anteilnahme oder Bestürzung, das zu einem Moment des Innehaltens führt.", "example": "„Ich war betroffen, als ich von dem Unglück in den Nachrichten hörte.“", "related": ["angenehm-hoch-9", "unangenehm-hoch-100", "unangenehm-hoch-109", "angenehm-niedrig-79"]}, {"id": "unangenehm-niedrig-152", "term": "Desillusioniert", "valence": "unangenehm", "arousal": "niedrig", "description": "„Desillusioniert“ beschreibt einen emotionalen Zustand, in dem jemand enttäuscht und ernüchtert ist, weil sich Erwartungen oder Hoffnungen als falsch oder unrealistisch herausgestellt haben. Es ist ein Gefühl von Ernüchterung, das oft mit Frust und Resignation einhergeht.", "example": "„Nach all den leeren Versprechungen fühlte ich mich desillusioniert und konnte mich nicht mehr für das Projekt begeistern.“", "related": ["unangenehm-niedrig-156", "unangenehm-niedrig-155", "unangenehm-niedrig-168"]}, {"id": "unangenehm-niedrig-153", "term": "Distanziert", "valence": "unangenehm", "arousal": "niedrig", "description": "„Distanziert“ beschreibt einen emotionalen Zustand, in dem jemand sich innerlich oder äußerlich von einer Person, Situation oder Emotion zurückzieht. Es ist ein Gefühl von Zurückhaltung oder Kühle, das oft mit bewusster Abgrenzung oder Desinteresse verbunden ist.", "example": "„Nach dem Streit fühlte ich mich distanziert und hatte keine Lust, weiter mit ihm zu sprechen.“", "related": ["unangenehm-niedrig-154"]}, {"id": "unangenehm-niedrig-154", "term": "Entfremdet", "valence": "unangenehm", "arousal": "niedrig", "description": "„Entfremdet“ beschreibt einen emotionalen Zustand, in dem jemand sich von anderen distanziert, ausgeschlossen oder nicht mehr verbunden fühlt. Es ist ein Gefühl von Isolation und innerer Leere, oft ausgelöst durch mangelnde Nähe oder Verständnis in Beziehungen.", "example": "„Ich fühlte mich entfremdet, als niemand auf der Party wirklich mit mir sprach.“", "related": ["unangenehm-niedrig-153"]}, {"id": "unangenehm-niedrig-155", "term": "Enttäuscht", "valence": "unangenehm", "arousal": "niedrig", "description": "„Enttäuscht“ beschreibt einen emotionalen Zustand, in dem jemand Traurigkeit oder Unzufriedenheit empfindet, weil eine Erwartung, Hoffnung oder ein Wunsch nicht erfüllt wurde. Es ist ein Gefühl, das oft mit Frust und Resignation einhergeht.", "example": "„Ich war enttäuscht, als der geplante Ausflug wegen des schlechten Wetters abgesagt wurde.“", "related": ["unangenehm-niedrig-156", "unangenehm-niedrig-172", "unangenehm-niedrig-152"]}, {"id": "unangenehm-niedrig-156", "term": "Ernüchtert", "valence": "unangenehm", "arousal": "niedrig", "description": "„Ernüchtert“ beschreibt einen emotionalen Zustand, in dem jemand enttäuscht und desillusioniert ist, weil frühere Erwartungen, Hoffnungen oder Ideale nicht erfüllt wurden. Es ist ein Gefühl von Frust und Verlust von Begeisterung.", "example": "„Ich fühlte mich ernüchtert, als ich erkannte, dass die versprochenen Veränderungen nie eintreten würden.“", "related": ["unangenehm-niedrig-155", "unangenehm-niedrig-152", "angenehm-niedrig-79"]}, {"id": "unangenehm-niedrig-157", "term": "Faul", "valence": "unangenehm", "arousal": "niedrig", "description": "„Faul“ beschreibt einen emotionalen Zustand, in dem jemand sich antriebslos, unmotiviert und ohne Lust fühlt, aktiv zu werden oder Aufgaben zu erledigen. Es ist ein Gefühl von Trägheit, das oft mit dem Wunsch nach Bequemlichkeit einhergeht.", "example": "„Ich fühlte mich faul und wollte den ganzen Tag einfach nur auf dem Sofa liegen.“", "related": []}, {"id": "unangenehm-niedrig-158", "term": "Gedemütigt", "valence": "unangenehm", "arousal": "niedrig", "description": "„Gedemütigt“ beschreibt einen emotionalen Zustand, in dem jemand sich erniedrigt, beschämt und verletzt fühlt, oft aufgrund von Bloßstellung oder respektlosem Verhalten durch andere. Es ist ein tiefgreifendes Gefühl von Scham und Verletzung.", "example": "„Ich fühlte mich gedemütigt, als mein Fehler vor allen Kollegen öffentlich gemacht wurde.“", "related": ["unangenehm-hoch-97", "unangenehm-niedrig-161"]}, {"id": "unangenehm-niedrig-159", "term": "Gelangweilt", "valence": "unangenehm", "arousal": "niedrig", "description": "„Gelangweilt“ beschreibt einen emotionalen Zustand, in dem jemand sich uninteressiert, unmotiviert und wenig angesprochen fühlt, oft weil die aktuelle Situation als eintönig oder reizlos empfunden wird.", "example": "„Ich fühlte mich gelangweilt, während ich auf den verspäteten Zug wartete und nichts zu tun hatte.“", "related": []}, {"id": "unangenehm-niedrig-160", "term": "Grübelnd", "valence": "unangenehm", "arousal": "niedrig", "description": "„Grübelnd“ beschreibt einen emotionalen Zustand, in dem jemand tief in nachdenkliche, oft düstere oder sorgenvollen Gedanken versunken ist. Es ist ein Gefühl von innerer Unruhe, das häufig mit Nachdenken über Probleme oder unangenehme Erlebnisse einhergeht.", "example": "„Ich saß grübelnd am Fenster und dachte über die Fehler nach, die ich gemacht hatte.“", "related": ["angenehm-niedrig-79", "angenehm-hoch-18"]}, {"id": "unangenehm-niedrig-161", "term": "Herabgesetzt", "valence": "unangenehm", "arousal": "niedrig", "description": "„Herabgesetzt“ beschreibt einen emotionalen Zustand, in dem jemand sich weniger wertgeschätzt, klein oder unbedeutend fühlt, oft durch die Worte oder Handlungen anderer. Es ist ein Gefühl von Verletzung und Entwertung.", "example": "„Ich fühlte mich herabgesetzt, als meine Ideen im Meeting ohne Begründung abgewiesen wurden.“", "related": ["unangenehm-niedrig-158", "unangenehm-niedrig-164", "unangenehm-hoch-97", "unangenehm-niedrig-179"]}, {"id": "unangenehm-niedrig-162", "term": "Melancholisch", "valence": "unangenehm", "arousal": "niedrig", "description": "„Melancholisch“ beschreibt einen emotionalen Zustand, in dem jemand sich still, nachdenklich und von einer sanften Traurigkeit erfüllt fühlt. Es ist ein Gefühl von Wehmut, das oft mit Erinnerungen an vergangene Zeiten oder unerfüllte Sehnsüchte verbunden ist.", "example": "„Ich fühlte mich melancholisch, als ich durch alte Fotos blätterte und an vergangene Tage dachte.“", "related": ["unangenehm-niedrig-172", "angenehm-niedrig-79", "unangenehm-niedrig-171"]}, {"id": "unangenehm-niedrig-163", "term": "Mies", "valence": "unangenehm", "arousal": "niedrig", "description": "„Mies“ beschreibt einen emotionalen Zustand, in dem jemand sich schlecht, unwohl oder einfach unzufrieden fühlt, oft ohne einen konkreten Grund. Es ist ein Gefühl von allgemeiner Niedergeschlagenheit oder Gereiztheit.", "example": "„Ich fühlte mich einfach mies, als der Tag mit Regen und Kopfschmerzen begann.“", "related": ["unangenehm-niedrig-175", "unangenehm-niedrig-165", "unangenehm-hoch-112"]}, {"id": "unangenehm-niedrig-164", "term": "Missachtet", "valence": "unangenehm", "arousal": "niedrig", "description": "„Missachtet“ beschreibt einen emotionalen Zustand, in dem jemand sich verletzt, abgewertet oder nicht respektiert fühlt, weil seine Gefühle, Meinungen oder Grenzen ignoriert wurden. Es ist ein Gefühl von Kränkung und Enttäuschung.", "example": "„Ich fühlte mich missachtet, als mein Beitrag zur Diskussion einfach übergangen wurde.“", "related": ["unangenehm-niedrig-161", "unangenehm-niedrig-158"]}, {"id": "unangenehm-niedrig-165", "term": "Missmutig", "valence": "unangenehm", "arousal": "niedrig", "description": "„Missmutig“ beschreibt einen emotionalen Zustand, in dem jemand sich düster, schlecht gelaunt und in sich zurückgezogen fühlt. Es ist ein Gefühl von innerer Schwere und Unzufriedenheit, das oft mit Schweigsamkeit einhergeht.", "example": "„Ich war missmutig und zog mich zurück, weil der Tag voller Enttäuschungen war.“", "related": ["unangenehm-niedrig-166", "unangenehm-niedrig-175", "unangenehm-hoch-114"]}, {"id": "unangenehm-niedrig-166", "term": "Mürrisch", "valence": "unangenehm", "arousal": "niedrig", "description": "„Mürrisch“ beschreibt einen emotionalen Zustand, in dem jemand sich schlecht gelaunt, gereizt oder leicht genervt fühlt, oft ohne einen klaren oder offensichtlichen Grund. Es ist ein Gefühl von innerer Unzufriedenheit, das sich in zurückhaltendem oder schroffem Verhalten äußern kann.", "example": "„Ich war mürrisch, weil ich nicht genug geschlafen hatte und der Tag schon hektisch begann.“", "related": ["unangenehm-niedrig-165", "unangenehm-hoch-114"]}, {"id": "unangenehm-niedrig-167", "term": "Niedergeschlagen", "valence": "unangenehm", "arousal": "niedrig", "description": "„Niedergeschlagen“ beschreibt einen emotionalen Zustand, in dem jemand sich traurig, kraftlos und ohne Hoffnung fühlt. Es ist ein Gefühl von innerer Schwere, das oft mit Antriebslosigkeit und dem Wunsch nach Rückzug einhergeht.", "example": "„Nachdem ich die Absage für den Job erhalten hatte, fühlte ich mich völlig niedergeschlagen.“", "related": ["unangenehm-niedrig-172", "unangenehm-niedrig-145", "unangenehm-niedrig-162"]}, {"id": "unangenehm-niedrig-168", "term": "Pessimistisch", "valence": "unangenehm", "arousal": "niedrig", "description": "„Pessimistisch“ beschreibt einen emotionalen Zustand, in dem jemand die Zukunft oder eine Situation negativ sieht und wenig Hoffnung auf ein positives Ergebnis hat. Es ist ein Gefühl von Zweifel und Entmutigung, das oft mit Sorgen und einer negativen Erwartungshaltung einhergeht.", "example": "„Ich war pessimistisch, dass das Projekt rechtzeitig fertig werden würde, da so viele Probleme auftraten.“", "related": ["unangenehm-niedrig-156"]}, {"id": "unangenehm-niedrig-169", "term": "Ratlos", "valence": "unangenehm", "arousal": "niedrig", "description": "„Ratlos“ beschreibt einen emotionalen Zustand, in dem jemand sich unsicher, überfordert oder hilflos fühlt, oft weil eine Situation unerwartet oder unangenehm ist. Es ist ein Gefühl von Verwirrung oder Resignation, manchmal mit einem Hauch von Humor.", "example": "„Ich fühlte mich ratlos, als mein Computer mitten in der Präsentation plötzlich abstürzte.“", "related": ["unangenehm-hoch-139", "unangenehm-hoch-133"]}, {"id": "unangenehm-niedrig-170", "term": "Reumütig", "valence": "unangenehm", "arousal": "niedrig", "description": "„Reumütig“ beschreibt einen emotionalen Zustand, in dem jemand tiefes Bedauern über eigenes Fehlverhalten oder eine falsche Entscheidung empfindet. Es ist ein Gefühl von Schuld und Einsicht, oft verbunden mit dem Wunsch, etwas wiedergutzumachen.", "example": "„Ich fühlte mich reumütig, als mir klar wurde, wie sehr meine Worte ihn verletzt hatten.“", "related": ["unangenehm-hoch-97"]}, {"id": "unangenehm-niedrig-171", "term": "Sehnsüchtig", "valence": "unangenehm", "arousal": "niedrig", "description": "„Sehnsüchtig“ beschreibt einen emotionalen Zustand, in dem jemand einen starken Wunsch oder eine Hoffnung auf etwas hat, das noch unerreichbar scheint. Es ist ein Gefühl, das oft mit Träumen, Erwartungen und leichtem Wehmut verbunden ist.", "example": "„Ich blickte sehnsüchtig auf die Bilder von fernen Ländern und wünschte mir, dort zu sein.“", "related": ["unangenehm-niedrig-162", "unangenehm-niedrig-172"]}, {"id": "unangenehm-niedrig-172", "term": "Traurig", "valence": "unangenehm", "arousal": "niedrig", "description": "„Traurig“ beschreibt einen emotionalen Zustand, in dem jemand sich niedergeschlagen, enttäuscht oder innerlich belastet fühlt. Es ist ein Gefühl von Kummer oder Melancholie, das oft durch einen Verlust, eine Enttäuschung oder schwierige Situationen ausgelöst wird.", "example": "„Ich fühlte mich traurig, als ich erfuhr, dass unser Treffen abgesagt wurde.“", "related": ["unangenehm-niedrig-167", "unangenehm-niedrig-146", "unangenehm-niedrig-171", "unangenehm-niedrig-162"]}, {"id": "unangenehm-niedrig-173", "term": "Unfähig", "valence": "unangenehm", "arousal": "niedrig", "description": "„Unfähig“ beschreibt einen emotionalen Zustand, in dem jemand sich unzulänglich, üb ne jede Erklärung abgelehnt wurde.“", "related": ["unangenehm-niedrig-144"]}];

const WORLD_W = 2600;
const WORLD_H = 2000;

const byId = {};
TERMS.forEach(t => byId[t.id] = t);

const widget = document.currentScript.previousElementSibling;
const world = widget.querySelector('#world');
const viewport = widget.querySelector('#viewport');

// ---- build chip elements (initial position = zone center, refined by simulation) ----
const margin = 60;
const gap = 30;
const halfW = WORLD_W/2, halfH = WORLD_H/2;

function zoneRect(valence, arousal){
  const x0 = valence === 'unangenehm' ? margin : halfW + gap/2;
  const x1 = valence === 'unangenehm' ? halfW - gap/2 : WORLD_W - margin;
  const y0 = arousal === 'hoch' ? margin : halfH + gap/2;
  const y1 = arousal === 'hoch' ? halfH - gap/2 : WORLD_H - margin;
  return {x0,y0,x1,y1};
}

const nodes = TERMS.map(t => {
  const r = zoneRect(t.valence, t.arousal);
  return {
    id: t.id,
    x: r.x0 + Math.random()*(r.x1-r.x0),
    y: r.y0 + Math.random()*(r.y1-r.y0),
    zone: r,
    vx: 0, vy: 0,
    w: 0, h: 0,
    el: null
  };
});
const nodeById = {};
nodes.forEach(n => nodeById[n.id] = n);

nodes.forEach(n => {
  const t = byId[n.id];
  const el = document.createElement('div');
  el.className = 'chip';
  el.textContent = t.term;
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  el.dataset.id = n.id;
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPopup(n.id); }
  });
  world.appendChild(el);
  n.el = el;
});

// measure
nodes.forEach(n => {
  n.w = n.el.offsetWidth;
  n.h = n.el.offsetHeight;
});

// ---- simple force simulation (repulsion + related-link springs + zone containment) ----
function simulate(iterations){
  for (let iter=0; iter<iterations; iter++){
    // repulsion
    for (let i=0;i<nodes.length;i++){
      const a = nodes[i];
      for (let j=i+1;j<nodes.length;j++){
        const b = nodes[j];
        let dx = a.x-b.x, dy = a.y-b.y;
        let dist = Math.sqrt(dx*dx+dy*dy) || 0.001;
        const minDistX = (a.w+b.w)/2 + 6;
        const minDistY = (a.h+b.h)/2 + 6;
        const overlapX = minDistX - Math.abs(dx);
        const overlapY = minDistY - Math.abs(dy);
        if (overlapX > 0 && overlapY > 0){
          const pushX = (overlapX/2) * (dx>=0?1:-1) * 0.5;
          const pushY = (overlapY/2) * (dy>=0?1:-1) * 0.5;
          if (Math.abs(overlapX) < Math.abs(overlapY)){
            a.x += pushX; b.x -= pushX;
          } else {
            a.y += pushY; b.y -= pushY;
          }
        } else {
          const desired = 90;
          if (dist < desired){
            const f = (desired-dist)/dist * 0.04;
            a.x += dx*f; a.y += dy*f;
            b.x -= dx*f; b.y -= dy*f;
          }
        }
      }
    }
    // related springs
    nodes.forEach(a => {
      const t = byId[a.id];
      (t.related||[]).forEach(rid => {
        const b = nodeById[rid];
        if (!b) return;
        let dx = b.x-a.x, dy = b.y-a.y;
        let dist = Math.sqrt(dx*dx+dy*dy) || 0.001;
        const desired = 110;
        const f = (dist-desired) * 0.015;
        a.x += dx/dist*f; a.y += dy/dist*f;
      });
    });
    // zone containment + weak center pull
    nodes.forEach(n => {
      const cx = (n.zone.x0+n.zone.x1)/2, cy=(n.zone.y0+n.zone.y1)/2;
      n.x += (cx-n.x)*0.006;
      n.y += (cy-n.y)*0.006;
      const hw = n.w/2, hh = n.h/2;
      n.x = Math.min(n.zone.x1-hw, Math.max(n.zone.x0+hw, n.x));
      n.y = Math.min(n.zone.y1-hh, Math.max(n.zone.y0+hh, n.y));
    });
  }
}
simulate(260);
nodes.forEach(n => {
  n.el.style.left = n.x + 'px';
  n.el.style.top = n.y + 'px';
});

// ---- content bounding box: keeps axis labels close to the actual clusters ----
let contentMinX=Infinity, contentMaxX=-Infinity, contentMinY=Infinity, contentMaxY=-Infinity;
nodes.forEach(n => {
  contentMinX = Math.min(contentMinX, n.x - n.w/2);
  contentMaxX = Math.max(contentMaxX, n.x + n.w/2);
  contentMinY = Math.min(contentMinY, n.y - n.h/2);
  contentMaxY = Math.max(contentMaxY, n.y + n.h/2);
});
const labelGap = 46;
const midX = (contentMinX+contentMaxX)/2, midY = (contentMinY+contentMaxY)/2;
widget.querySelector('#label-top').style.left = midX + 'px';
widget.querySelector('#label-top').style.top = (contentMinY - labelGap) + 'px';
widget.querySelector('#label-bottom').style.left = midX + 'px';
widget.querySelector('#label-bottom').style.top = (contentMaxY + labelGap) + 'px';
widget.querySelector('#label-left').style.left = (contentMinX - labelGap) + 'px';
widget.querySelector('#label-left').style.top = midY + 'px';
widget.querySelector('#label-right').style.left = (contentMaxX + labelGap) + 'px';
widget.querySelector('#label-right').style.top = midY + 'px';

// ---- pan & zoom ----
let scale = 0.5, tx = 0, ty = 0;
function applyTransform(){
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}
function fitInitial(){
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const pad = 90;
  const x0 = contentMinX - labelGap - pad, x1 = contentMaxX + labelGap + pad;
  const y0 = contentMinY - labelGap - pad, y1 = contentMaxY + labelGap + pad;
  scale = Math.min(vw/(x1-x0), vh/(y1-y0));
  tx = vw/2 - ((x0+x1)/2)*scale;
  ty = vh/2 - ((y0+y1)/2)*scale;
  applyTransform();
}
window.addEventListener('resize', fitInitial);
fitInitial();

let isDragging = false, dragStart = null, moved = false;
viewport.addEventListener('mousedown', e => {
  isDragging = true; moved = false;
  dragStart = {x: e.clientX, y: e.clientY, tx, ty};
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if (Math.abs(dx)+Math.abs(dy) > 4) moved = true;
  tx = dragStart.tx + dx; ty = dragStart.ty + dy;
  applyTransform();
});
window.addEventListener('mouseup', () => { isDragging=false; viewport.classList.remove('dragging'); });

function zoomAt(clientX, clientY, factor){
  const rect = viewport.getBoundingClientRect();
  const px = clientX-rect.left, py = clientY-rect.top;
  const wx = (px-tx)/scale, wy = (py-ty)/scale;
  scale = Math.min(3, Math.max(0.15, scale*factor));
  tx = px - wx*scale;
  ty = py - wy*scale;
  applyTransform();
}
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  zoomAt(e.clientX, e.clientY, factor);
}, {passive:false});

widget.querySelector('#zoom-in').addEventListener('click', () => {
  const r = viewport.getBoundingClientRect();
  zoomAt(r.left+r.width/2, r.top+r.height/2, 1.25);
});
widget.querySelector('#zoom-out').addEventListener('click', () => {
  const r = viewport.getBoundingClientRect();
  zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.25);
});
widget.querySelector('#zoom-reset').addEventListener('click', fitInitial);

// touch support
let touchState = null;
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 1){
    touchState = {mode:'pan', x:e.touches[0].clientX, y:e.touches[0].clientY, tx, ty};
  } else if (e.touches.length === 2){
    const [a,b] = e.touches;
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    touchState = {mode:'pinch', dist, scale};
  }
}, {passive:true});
viewport.addEventListener('touchmove', e => {
  if (!touchState) return;
  if (touchState.mode === 'pan' && e.touches.length === 1){
    const dx = e.touches[0].clientX - touchState.x;
    const dy = e.touches[0].clientY - touchState.y;
    tx = touchState.tx + dx; ty = touchState.ty + dy;
    applyTransform();
  } else if (touchState.mode === 'pinch' && e.touches.length === 2){
    const [a,b] = e.touches;
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const factor = dist/touchState.dist;
    scale = Math.min(3, Math.max(0.15, touchState.scale*factor));
    applyTransform();
  }
}, {passive:true});
viewport.addEventListener('touchend', () => { touchState = null; });

// ---- click / highlight / popup ----
const overlay = widget.querySelector('#overlay');
const popup = widget.querySelector('#popup');

function clearHighlight(){
  nodes.forEach(n => n.el.classList.remove('dim','related','active'));
}

function highlight(id){
  const t = byId[id];
  clearHighlight();
  nodes.forEach(n => n.el.classList.add('dim'));
  nodeById[id].el.classList.remove('dim');
  nodeById[id].el.classList.add('active');
  (t.related||[]).forEach(rid => {
    const rn = nodeById[rid];
    if (rn){ rn.el.classList.remove('dim'); rn.el.classList.add('related'); }
  });
}

function focusOn(ids){
  const relevant = ids.map(i => nodeById[i]).filter(Boolean);
  if (!relevant.length) return;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  relevant.forEach(n => {
    minX = Math.min(minX, n.x-n.w/2); maxX = Math.max(maxX, n.x+n.w/2);
    minY = Math.min(minY, n.y-n.h/2); maxY = Math.max(maxY, n.y+n.h/2);
  });
  const pad = 80;
  minX -= pad; maxX += pad; minY -= pad; maxY += pad;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const panelWidth = Math.min(380, vw*0.92);
  const availW = Math.max(200, vw - panelWidth);
  const fitScale = Math.min(availW/(maxX-minX), vh/(maxY-minY));
  scale = Math.min(1.3, Math.max(0.3, fitScale));
  tx = availW/2 - ((minX+maxX)/2)*scale;
  ty = vh/2 - ((minY+maxY)/2)*scale;
  world.style.transition = 'transform .45s cubic-bezier(.2,.7,.3,1)';
  applyTransform();
  clearTimeout(focusOn._t);
  focusOn._t = setTimeout(() => { world.style.transition = ''; }, 460);
}

function openPopup(id){
  const t = byId[id];
  highlight(id);
  focusOn([id, ...(t.related||[])]);
  const color = t.valence === 'angenehm' ? 'var(--angenehm)' : 'var(--unangenehm)';
  const relatedHtml = (t.related||[]).map(rid => {
    const rt = byId[rid];
    return `<button data-id="${rid}">${rt.term}</button>`;
  }).join('') || '<span class="plain">Keine verlinkten Begriffe</span>';
  popup.innerHTML = `
    <button class="close" id="popup-close">✕</button>
    <span class="badge" style="background:${color}">${t.valence} · ${t.arousal === 'hoch' ? 'aktivierend' : 'deaktivierend'}</span>
    <h2>${t.term}</h2>
    <p class="desc">${t.description}</p>
    ${t.example ? `<p class="example">${t.example}</p>` : ''}
    <div class="related-title">Verwandte Begriffe</div>
    <div class="related-list">${relatedHtml}</div>
  `;
  overlay.classList.add('show');
  popup.querySelector('#popup-close').addEventListener('click', closePopup);
  popup.querySelectorAll('.related-list button').forEach(btn => {
    btn.addEventListener('click', () => openPopup(btn.dataset.id));
  });
}
function closePopup(){
  overlay.classList.remove('show');
  clearHighlight();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

world.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (moved) return;
  if (chip){ openPopup(chip.dataset.id); return; }
  if (overlay.classList.contains('show')) closePopup();
});

// ---- search ----
const searchInput = widget.querySelector('#search');
const searchResults = widget.querySelector('#search-results');
function panToNode(id){
  const n = nodeById[id];
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.max(scale, 0.9);
  tx = vw/2 - n.x*scale;
  ty = vh/2 - n.y*scale;
  applyTransform();
}
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q){ searchResults.style.display='none'; searchResults.innerHTML=''; return; }
  const matches = TERMS.filter(t => t.term.toLowerCase().includes(q)).slice(0,8);
  if (!matches.length){ searchResults.style.display='none'; searchResults.innerHTML=''; return; }
  searchResults.innerHTML = matches.map(m => `<button data-id="${m.id}">${m.term}</button>`).join('');
  searchResults.style.display = 'block';
  searchResults.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      panToNode(btn.dataset.id);
      openPopup(btn.dataset.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    });
  });
});
})();
</script>
